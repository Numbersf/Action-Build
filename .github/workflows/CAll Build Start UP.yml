name: CAll Build Start UP

on:
  workflow_dispatch:
    inputs:
      BATCH:
        description: "9个一组分批并行-选择分支(1-4)"
        required: true
        default: "1"
      CONFIRMATION:
        description: "我已看完README.md,了解此工作流的风险和作用,有能力取消卡住的工作流运行和删除缓存,并执意继续运行"
        required: true
        default: "请输入完整标题"

permissions:
  actions: read
  contents: read

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Check User Confirmation
        run: |
          CONFIRM="${{ github.event.inputs.CONFIRMATION }}"
          EXPECT="我已看完README.md,了解此工作流的风险和作用,有能力取消卡住的工作流运行和删除缓存,并执意继续运行"

          if [[ "$CONFIRM" != "$EXPECT" ]]; then
            echo "❌ 输入无效，您未正确确认工作流风险。请阅读更新日志并正确输入确认内容。如果你仅仅只是想运行单个机型，这不是你该来的地方，请使用本仓库的另外一个工作流文件 Build All OnePlus Kernels"
            exit 1
          fi

      - name: Set Matrix from FILE List
        id: set-matrix
        run: |
          BATCH="${{ github.event.inputs.BATCH }}"

          if [[ "$BATCH" == "1" ]]; then
            FILE_LIST=(
              "oneplus_nord_ce4_lite_5g_v"
              "oneplus_nord_ce4_v"
              "oneplus_nord_4_v"
              "oneplus_ace_3v_v"
              "oneplus_10_pro_v"
              "oneplus_10t_v"
              "oneplus_11r_v"
              "oneplus_ace2_v"
              "oneplus_ace_pro_v"
            )
          elif [[ "$BATCH" == "2" ]]; then
            FILE_LIST=(
              "oneplus_11_v"
              "oneplus_12r_v"
              "oneplus_ace2_pro_v"
              "oneplus_ace3_v"
              "oneplus_open_v"
              "oneplus_12_v"
              "oneplus_13r"
              "oneplus_ace3_pro_v"
              "oneplus_ace5"
            )
          elif [[ "$BATCH" == "3" ]]; then
            FILE_LIST=(
              "oneplus_pad_pro_v"
              "oneplus_pad2_v"
              "oneplus_nord_5"
              "oneplus_ace5_pro"
              "oneplus_ace5_pro_b"
              "oneplus_13"
              "oneplus_13_b"
              "oneplus_13t"
              "oneplus_13t_b"
            )
          elif [[ "$BATCH" == "4" ]]; then
            FILE_LIST=(
              "oneplus_13_global"
              "oneplus_13s"
              "oneplus_13s_b"
              "oneplus_pad_2_pro"
              "oneplus_pad_3"
              "oneplus_ace5_ultra"
              "oneplus_ace_6"
              "oneplus_15"
            )
          else
            echo "无效的 BATCH 值: $BATCH"
            exit 1
          fi

          MATRIX_JSON=$(printf '%s\n' "${FILE_LIST[@]}" | jq -R -s -c '
            split("\n")[:-1] |
            map({
              file: .,
              file_short: (sub("_[a-z]$"; ""))
              enable_sched: (
                . == "oneplus_pad_2_pro" or
                . == "oneplus_13" or
                . == "oneplus_13_global" or
                . == "oneplus_13t" or
                . == "oneplus_13s" or
                . == "oneplus_ace5_ultra" or
                . == "oneplus_ace5_pro"
              )
            })
          ')
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  build:
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    uses: ./.github/workflows/build-kernel-reusable.yml
    with:
      FILE: ${{ matrix.file }}
      MANAGER_SOURCE: MIUIX
      SUSFS_CI: N/A
      KPM: KPM
      DYNAMIC_REPO: Numbersf
      BUILD_TIME: F
      KSU_META: susfs-main/Numbersf/
      LZ4_UPDATE: false
      ZRAM: 0/lz4kd/8589934592
      SUFFIX: ""
      SUBLEVEL: ""
      FAST_BUILD: true
      LSM_BBG: true
      NETFILTER: true
      CCM: true
      UNICODE_BYPASS: false
      SCHED_HMBIRD: ${{ matrix.enable_sched }}
      DROID_SPACES: false
      RE_KERNEL: false
      SUSFS_DEV: false
      SPACE_NOCLEAN: false
      BUILD_NOCACHE: false
      SUSFS_META: ""
    secrets: inherit