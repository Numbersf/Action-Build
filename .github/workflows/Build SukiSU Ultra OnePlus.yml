name: Build OnePlus_SukiSU Ultra All
on:
  workflow_dispatch:
    inputs:
      FILE:
        type: choice
        description: "配置文件"
        required: true
        default: oneplus_ace2_pro_v
        options:
          - oneplus_nord_ce4_lite_5g_v
          - oneplus_nord_ce4_v
          - oneplus_nord_4_v
          - oneplus_ace_3v_v
          - oneplus_10_pro_v
          - oneplus_10t_v
          - oneplus_11r_v
          - oneplus_ace2_v
          - oneplus_ace_pro_v
          - oneplus_11_v
          - oneplus_12r_v
          - oneplus_ace2_pro_v
          - oneplus_ace3_v
          - oneplus_open_v
          - oneplus_12_v
          - oneplus_13r
          - oneplus_ace3_pro_v
          - oneplus_ace5
          - oneplus_pad_pro_v
          - oneplus_pad2_v
          - oneplus_nord_5
          - oneplus_ace5_pro
          - oneplus_ace5_pro_b
          - oneplus_13
          - oneplus_13_b
          - oneplus_13_global
          - oneplus_13t
          - oneplus_13t_b
          - oneplus_13s
          - oneplus_13s_b
          - oneplus_pad_2_pro
          - oneplus_pad_3
          - oneplus_ace5_ultra
          - oneplus_ace_6
          - oneplus_15
      HOOK:
        type: choice
        description: "钩子选择"
        required: true
        default: manual
        options:
          - kprobe
          - manual
          - tracepoint
      SUSFS_CI:
        type: choice
        description: "下载SUSFS模块调用方式"
        required: true
        default: NoN
        options:
          - CI
          - Release
          - NoN
      KSU_META:
        type: string
        description: "分支名(必填)/自定义版本标识(留空不修改)/调整提交hash(留空不修改)"
        required: false
        default: "susfs-main/Numbersf/"
      FAST_BUILD:
        type: boolean
        description: "是否启用极速构建？"
        required: true
        default: true
      LSM:
        type: boolean
        description: "是否启用内核层面阻止对关键分区/设备节点的非法写入(LSM)？"
        required: true
        default: true
      SCHED:
        type: boolean
        description: "是否添加风驰驱动？"
        required: true
        default: false
      ZRAM:
        type: boolean
        description: "是否添加更多ZRAM算法？"
        required: true
        default: false
      optimize_level:
        type: choice
        description: "编译器优化等级: O2 (平衡) 或 O3 (激进)"
        required: false
        default: 'O2'
        options:
          - O2
          - O3
      clean:
        type: boolean
        description: "强制清洁构建(不使用ccache加速)"
        required: false
        default: false

jobs:
  build:
    name: ${{ github.event.inputs.FAST_BUILD == 'true' && ' [FAST]' || '' }}${{ github.event.inputs.SCHED == 'true' && ' [SCHED]' || '' }}${{ github.event.inputs.ZRAM == 'true' && ' [ZRAM]' || '' }}${{ github.event.inputs.LSM == 'true' && ' [LSM]' || '' }}${{ github.event.inputs.optimize_level }}${{ github.event.inputs.clean == 'true' && ' [CLEAN]' || '' }}For ${{ github.event.inputs.FILE }}
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: "content"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: 3G
      CCACHE_SLOPPINESS: "file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Workflow Inputs
        run: |
          set -euo pipefail
          echo "::group::Input validation"
          
          KSU_META="${{ github.event.inputs.KSU_META }}"
          if [[ -n "$KSU_META" && ! "$KSU_META" =~ ^[a-zA-Z0-9_/-]+(/[a-zA-Z0-9_.-]*)?(/[a-f0-9]{0,40})?$ ]]; then
            echo "::error::Invalid KSU_META format: $KSU_META"
            echo "Expected format: branch/version/hash (e.g., susfs-main/Numbersf/abc123)"
            exit 1
          fi
          
          if [[ "${{ github.event.inputs.optimize_level }}" != "O2" && \
                "${{ github.event.inputs.optimize_level }}" != "O3" ]]; then
            echo "::error::Invalid optimize_level: ${{ github.event.inputs.optimize_level }}"
            exit 1
          fi
          
          VALID_HOOKS=("kprobe" "manual" "tracepoint")
          HOOK="${{ github.event.inputs.HOOK }}"
          if [[ ! " ${VALID_HOOKS[@]} " =~ " ${HOOK} " ]]; then
            echo "::error::Invalid HOOK type: $HOOK"
            exit 1
          fi
          
          echo "✅ All inputs validated successfully"
          echo "::endgroup::"

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 6144
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Optimize System for Kernel Build
        run: |
          set -euo pipefail
          echo "::group::System optimization"
          
          ulimit -n 65536 || true
          
          for disk in /sys/block/sd*/queue/scheduler; do
            if [ -f "$disk" ]; then
              echo "none" | sudo tee "$disk" 2>/dev/null || true
            fi
          done
          
          sudo systemctl stop unattended-upgrades 2>/dev/null || true
          sudo systemctl stop apt-daily.timer 2>/dev/null || true
          sudo systemctl stop snapd.service 2>/dev/null || true
          
          for cpu in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
            if [ -f "$cpu" ]; then
              echo "performance" | sudo tee "$cpu" 2>/dev/null || true
            fi
          done
          
          sudo sysctl -w vm.swappiness=10
          sudo sysctl -w vm.vfs_cache_pressure=50
          sudo sysctl -w vm.dirty_ratio=10
          sudo sysctl -w vm.dirty_background_ratio=5
          
          echo "✅ System optimized for build"
          echo "::endgroup::"

      - name: Check GitHub API Rate Limit
        continue-on-error: true
        run: |
          echo "::group::GitHub API Rate Limit Status"
          RATE_INFO=$(curl -s https://api.github.com/rate_limit)
          
          REMAINING=$(echo "$RATE_INFO" | jq -r '.rate.remaining')
          LIMIT=$(echo "$RATE_INFO" | jq -r '.rate.limit')
          RESET=$(echo "$RATE_INFO" | jq -r '.rate.reset')
          
          if [ "$REMAINING" -lt 10 ]; then
            RESET_TIME=$(date -d "@$RESET" '+%Y-%m-%d %H:%M:%S UTC' 2>/dev/null || date -r "$RESET" '+%Y-%m-%d %H:%M:%S UTC')
            echo "⚠️ WARNING: Only $REMAINING API calls remaining (limit: $LIMIT)"
            echo "Rate limit resets at: $RESET_TIME"
            echo "::warning::GitHub API rate limit low - build may fail during manifest fetch"
          else
            echo "✅ API rate limit OK: $REMAINING/$LIMIT remaining"
          fi
          
          echo "::endgroup::"

      - name: Extract Manifest Info
        id: extract_info
        env:
          FILE: ${{ github.event.inputs.FILE }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          
          if [[ "$FILE" =~ ^(.+)_([a-zA-Z])$ ]]; then
            FILE_CONF="${BASH_REMATCH[1]}"
          else
            FILE_CONF="$FILE"
          fi
          
          FILE_BASE=$(echo "$FILE_CONF" | sed -E 's/_([a-zA-Z0-9])/\U\1/g; s/^oneplus/OnePlus/; s/^realme/Realme/; s/^oppo/Oppo/')
          
          mkdir -p ".repo/manifests_fallback"
          XML_PATH=".repo/manifests_fallback/${FILE}.xml"
          README_PATH=".repo/manifests_fallback/README.md"
          
          echo "处理 FILE=$FILE, CONF=$FILE_CONF, BASE=$FILE_BASE"
          echo "FILE_CONF=$FILE_CONF" >> $GITHUB_ENV
          echo "FILE_BASE=$FILE_BASE" >> $GITHUB_ENV
      
          declare -A REPOS
          REPOS["OnePlusOSS"]="https://api.github.com/repos/OnePlusOSS/kernel_manifest"
          REPOS["Dynamic"]="https://api.github.com/repos/Numbersf/kernel_manifest"
      
          FOUND_REPO=""
          FOUND_BRANCH=""
      
          check_repo() {
            local OWNER=$1
            local REPO_URL=$2
      
            echo "🌐 尝试拉取 ${OWNER} 分支列表..."
            
            BRANCHES=$(curl -sS --retry 3 --retry-delay 2 --max-time 20 --connect-timeout 10 \
              -H "Accept: application/vnd.github.v3+json" \
              "${REPO_URL}/branches" 2>/dev/null | jq -r '.[].name' 2>/dev/null || true)
            
            if [[ -z "$BRANCHES" || "$BRANCHES" == "null" ]]; then
              echo "⚠️ ${OWNER} branches API returned empty/null"
              return 1
            fi
            
            for BRANCH in $BRANCHES; do
              XML_URL="https://raw.githubusercontent.com/${OWNER}/kernel_manifest/$BRANCH/${FILE}.xml"
              README_URL="https://raw.githubusercontent.com/${OWNER}/kernel_manifest/$BRANCH/README.md"
              
              if curl -sSf --head --max-time 10 --connect-timeout 5 "$XML_URL" > /dev/null 2>&1; then
                echo "✅ 在 ${OWNER} 找到 ${FILE}.xml (分支: $BRANCH)"
                
                if ! curl -sS --retry 3 --retry-delay 2 -o "$XML_PATH" "$XML_URL"; then
                  echo "⚠️ Failed to download ${FILE}.xml, retrying..."
                  sleep 2
                  curl -sS --retry 2 -o "$XML_PATH" "$XML_URL" || return 1
                fi
                
                curl -sS --retry 2 -o "$README_PATH" "$README_URL" 2>/dev/null || true
                
                FOUND_REPO="$OWNER"
                FOUND_BRANCH="$BRANCH"
                return 0
              fi
            done
            return 1
          }
      
          if check_repo "OnePlusOSS" "${REPOS["OnePlusOSS"]}"; then
            echo "MANIFEST_REPO=OnePlusOSS" >> $GITHUB_ENV
            echo "MANIFEST_BRANCH=$FOUND_BRANCH" >> $GITHUB_ENV
          fi
      
          if [[ -z "$FOUND_REPO" ]]; then
            DYNAMIC_URL="${REPOS["Dynamic"]}"
            DYNAMIC_OWNER=$(echo "$DYNAMIC_URL" | sed -E 's#https://api.github.com/repos/([^/]+)/.*#\1#')
            if check_repo "$DYNAMIC_OWNER" "$DYNAMIC_URL"; then
              echo "MANIFEST_REPO=$DYNAMIC_OWNER" >> $GITHUB_ENV
              echo "MANIFEST_BRANCH=$FOUND_BRANCH" >> $GITHUB_ENV
            fi
          fi
      
          if [[ -z "$FOUND_REPO" || ! -s "$XML_PATH" ]]; then
            echo "❌ 无法在动态仓库中找到 ${FILE}.xml"
            echo "::group::Debug: Rate limit status"
            curl -s https://api.github.com/rate_limit | jq '.rate' || true
            echo "::endgroup::"
            exit 1
          fi
      
          REVISION=$(grep -oP '<project[^>]+revision="\K[^"]+' "$XML_PATH" | \
            grep -E '(oneplus|realme|oppo)/' | head -n1 || true)
          
          if [ -z "$REVISION" ]; then
            echo "❌ 无法从 XML 中提取 revision"
            exit 1
          fi
          
          echo "解析 FILE 获取 CPU 和 ANDROID_VERSION..."
          
          CPU=$(echo "$REVISION" | sed -E 's#^(oneplus|realme|oppo)/([^_]+).*#\2#')
          ANDROID_VERSION=$(echo "$REVISION" | grep -oP '\d{1,2}\.\d{1,2}(\.\d{1,2})?')
          
          if [[ -z "$CPU" || -z "$ANDROID_VERSION" ]]; then
            echo "❌ 无法从 revision 中提取 CPU 或 ANDROID_VERSION"
            echo "Revision: $REVISION"
            exit 1
          fi
          
          ANDROID_MAJOR="${ANDROID_VERSION%%.*}"
          ANDROID_KERNEL_FORMAT="android${ANDROID_MAJOR}"
          
          echo "✅ CPU: $CPU"
          echo "✅ Android Version (numeric): $ANDROID_VERSION"
          echo "✅ Android Version (kernel format): $ANDROID_KERNEL_FORMAT"
          
          {
            echo "CPU=$CPU"
            echo "ANDROID_VERSION=$ANDROID_VERSION"
            echo "ANDROID_VERSION_KERNEL=$ANDROID_KERNEL_FORMAT"
            echo "ANDROID_SHORT_VERSION=${ANDROID_MAJOR}"
            echo "KANDROID_VERSION=$ANDROID_KERNEL_FORMAT"
          } >> $GITHUB_ENV
      
          echo "解析 README.md 获取 CPUD 和 BUILD_METHOD..."
          if [[ -s "$README_PATH" ]]; then
            BUILD_LINE=$(grep -m1 'oplus_build_kernel.sh' "$README_PATH" || true)
            if [[ -n "$BUILD_LINE" ]]; then
              CPUD=$(echo "$BUILD_LINE" | awk '{print $(NF-1)}')
              BUILD_METHOD=$(echo "$BUILD_LINE" | awk '{print $NF}')
              echo "✅ CPUD=$CPUD, BUILD_METHOD=$BUILD_METHOD"
              echo "CPUD=$CPUD" >> $GITHUB_ENV
              echo "BUILD_METHOD=$BUILD_METHOD" >> $GITHUB_ENV
            else
              echo "❌ README.md 中未找到构建命令"
            fi
          else
            echo "❌ README.md 下载失败或为空"
          fi
          
          echo "value=${FILE_BASE}_Android${ANDROID_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Debug Show Selected Inputs
        run: |
          echo "-----------------------"
          echo "Selected CPU: ${{ env.CPU }}"
          echo "Selected CPUD: ${{ env.CPUD }}"
          echo "Selected ANDROID_VERSION: ${{ env.ANDROID_VERSION }}"
          echo "Selected ANDROID_VERSION_KERNEL: ${{ env.ANDROID_VERSION_KERNEL }}"
          echo "Selected BUILD_METHOD: ${{ env.BUILD_METHOD }}"
          echo "Selected FILE: ${{ github.event.inputs.FILE }}"
          echo "Custom KSU_META: ${{ github.event.inputs.KSU_META }}"
          echo "Selected SUSFS_CI: ${{ github.event.inputs.SUSFS_CI }}"
          echo "Selected HOOK: ${{ github.event.inputs.HOOK }}"
          echo "Selected LSM: ${{ github.event.inputs.LSM }}"
          echo "Selected FAST_BUILD: ${{ github.event.inputs.FAST_BUILD }}"
          echo "Selected SCHED: ${{ github.event.inputs.SCHED }}"
          echo "Selected ZRAM: ${{ github.event.inputs.ZRAM }}"
          echo "Selected optimize_level: ${{ github.event.inputs.optimize_level }}"
          echo "Selected clean: ${{ github.event.inputs.clean }}"
          echo "-----------------------"

      - name: Check Disk Space
        run: df -h

      - name: Set Cache Environment
        run: |
          set -euo pipefail
          
          CACHE_DIR="$HOME/.ccache_${{ github.event.inputs.FILE }}"
          
          {
            echo "CCACHE_DIR=$CACHE_DIR"
            echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
          } >> $GITHUB_ENV
          
          mkdir -p "$CACHE_DIR"
          
          echo "============================================"
          echo "📦 ccache Environment"
          echo "============================================"
          echo "Cache directory: $CACHE_DIR"
          echo "Base directory: ${GITHUB_WORKSPACE}"
          echo "Target: ${{ github.event.inputs.FILE }}"
          echo "============================================"

      - name: Optimize Git for Large Repository
        run: |
          git config --global user.name "Numbersf"
          git config --global user.email "263623064@qq.com"
          git config --global core.compression 0
          git config --global core.preloadindex true
          git config --global core.fscache true
          git config --global gc.auto 0
          git config --global protocol.version 2
          git config --global fetch.parallel 8
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999

      - name: Install Minimal Dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential \
            clang lld llvm \
            flex bison libelf-dev libssl-dev libncurses-dev zlib1g-dev \
            liblz4-tool rsync unzip zip dwarves file python3 ccache jq bc dos2unix
     
      - name: Setup ccache
        run: |
          set -euo pipefail
          echo "::group::Setup ccache"
          
          CACHE_DIR="$HOME/.ccache_${{ github.event.inputs.FILE }}"
          mkdir -p "$CACHE_DIR"
          
          {
            echo "CCACHE_DIR=$CACHE_DIR"
            echo "CCACHE_MAXSIZE=3G"
            echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
            echo "CCACHE_COMPILERCHECK=content"
            echo "CCACHE_NOHASHDIR=true"
            echo "CCACHE_IGNOREOPTIONS=--sysroot*"
          } >> "$GITHUB_ENV"
          
          ccache -M 3G
          ccache -o compression=true
          ccache -o compression_level=6
          ccache -o direct_mode=true
          ccache -o hash_dir=false
          ccache -o file_clone=true || true
          ccache -o inode_cache=true || true
          ccache -o umask=002
          ccache -o sloppiness=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale
          
          if ccache --help 2>&1 | grep -q 'depend_mode'; then
            ccache -o depend_mode=true
          fi
          
          if [ "${{ github.event.inputs.clean }}" = "true" ]; then
            echo "CCACHE_DISABLE=1" >> "$GITHUB_ENV"
            echo "⚠️ Clean build mode - ccache disabled"
          else
            echo "✅ ccache enabled (3G max)"
          fi
          
          echo ""
          echo "Cache configuration:"
          echo "  Directory: $CACHE_DIR"
          echo "  Max size: 3G"
          echo "  File: ${{ github.event.inputs.FILE }}"
          echo "  Android: ${{ env.ANDROID_VERSION }}"
          echo "  Optimize: ${{ github.event.inputs.optimize_level }}"
          echo "::endgroup::"

      - name: Restore Ccache
        if: ${{ github.event.inputs.clean != 'true' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}         
          key: ccache-suki-v4-${{ github.event.inputs.FILE }}-${{ github.event.inputs.optimize_level }}-${{ github.event.inputs.FAST_BUILD == 'true' && 'fast' || 'standard' }}
          restore-keys: |
            ccache-suki-v4-${{ github.event.inputs.FILE }}-${{ github.event.inputs.optimize_level }}-
            ccache-suki-v4-${{ github.event.inputs.FILE }}-

      - name: Verify ccache
        if: ${{ github.event.inputs.clean != 'true' }}
        run: |
          set -euo pipefail
          echo "::group::Verify ccache"
          
          if [ -d "$CCACHE_DIR" ] && find "$CCACHE_DIR" -type f -print -quit 2>/dev/null | grep -q .; then
            echo "✅ Cache restored successfully"
            echo ""
            ccache -s | head -n 20
            echo ""
            echo "Cache size: $(du -sh "$CCACHE_DIR" 2>/dev/null | cut -f1)"
          else
            echo "ℹ️ No cache restored - cold build"
            echo "Cache will be populated for future builds"
          fi
          
          echo "::endgroup::"
      
      - name: Install Repo Tool
        run: |
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      - name: Initialize Repo and Sync
        env:
          FILE: ${{ github.event.inputs.FILE }}
        run: |
          set -euo pipefail
          echo "::group::Initialize and sync repository"
          
          export GIT_ASKPASS=/bin/true
          export GIT_TERMINAL_PROMPT=0
          
          mkdir kernel_workspace && cd kernel_workspace
          mkdir -p .repo/manifests
          cp "$GITHUB_WORKSPACE/.repo/manifests_fallback/${FILE}.xml" ".repo/manifests/${FILE}.xml"
      
          MANIFEST_REPO="${{ env.MANIFEST_REPO }}"
          MANIFEST_BRANCH="${{ env.MANIFEST_BRANCH }}"
          BASE_URL="https://github.com/${MANIFEST_REPO}/kernel_manifest.git"
      
          echo "📦 Initializing repo with $MANIFEST_REPO/$MANIFEST_BRANCH..."
          repo init -u "$BASE_URL" -b "$MANIFEST_BRANCH" -m "${FILE}.xml" \
            --repo-rev=v2.16 --depth=1 --no-clone-bundle --no-tags
      
          JOBS=$(nproc)
          JOBS=$((JOBS > 16 ? 16 : JOBS))
          JOBS=$((JOBS < 4 ? 4 : JOBS))
          
          echo "🔄 Syncing with -j${JOBS}..."
          
          for i in {1..3}; do
            if repo sync -c -j${JOBS} --force-sync --no-clone-bundle --no-tags \
               --optimized-fetch --prune --fail-fast; then
              echo "✅ Sync completed successfully"
              break
            else
              echo "⚠️ Sync attempt $i failed, retrying..."
              [ $i -eq 3 ] && exit 1
              sleep $(( i * 5 ))
            fi
          done
      
          for dir in kernel_platform/common kernel_platform/msm-kernel; do
            if [ -e "$dir/BUILD.bazel" ]; then
              sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' "$dir/BUILD.bazel"
            fi
            rm -f "$dir/android/abi_gki_protected_exports_"* 2>/dev/null || true
          done
          
          echo "::endgroup::"

      - name: Kernel Version Handling (Early)
        run: |
          set -euo pipefail
          echo "::group::Extract kernel version"
          
          cd kernel_workspace/kernel_platform
          
          BRANCH=""
          CONFIG_FILES=(
            "./common/build.config.constants"
            "./common/build.config.common"
            "./common/build.config.gki"
          )
          
          for f in "${CONFIG_FILES[@]}"; do
            if [ -f "$f" ]; then
              BRANCH=$(grep -m1 '^BRANCH=' "$f" 2>/dev/null | cut -d= -f2 | tr -d ' "' || true)
              if [ -n "$BRANCH" ]; then
                echo "✅ Found BRANCH=$BRANCH in $f"
                break
              fi
            fi
          done
          
          if [ -z "$BRANCH" ]; then
            echo "::warning::BRANCH not found in build.config files"
            echo "Attempting fallback from Makefile..."
            
            ORIG_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)
            
            if [[ "$ORIG_VERSION" =~ ^([0-9]+)\.([0-9]+) ]]; then
              KERNEL_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
              KANDROID_VERSION="android-unknown"
              echo "⚠️ Using Makefile-derived version: $KERNEL_VERSION"
            else
              KERNEL_VERSION="unknown"
              KANDROID_VERSION="android-unknown"
              echo "::error::Failed to determine kernel version"
            fi
          else
            KANDROID_VERSION="${BRANCH%-*}"
            KERNEL_VERSION="${BRANCH#*-}"
            echo "✅ Parsed: KANDROID_VERSION=$KANDROID_VERSION, KERNEL_VERSION=$KERNEL_VERSION"
          fi
          
          ORIG_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)
          
          {
            echo "KANDROID_VERSION=$KANDROID_VERSION"
            echo "KERNEL_VERSION=$KERNEL_VERSION"
            echo "TKERNEL_VERSION=$ORIG_VERSION"
          } >> $GITHUB_ENV
          
          echo ""
          echo "============================================"
          echo "📦 Kernel Version Information"
          echo "============================================"
          echo "Android Base: $KANDROID_VERSION"
          echo "Kernel Major: $KERNEL_VERSION"
          echo "Full Version: $ORIG_VERSION"
          echo "============================================"
          
          echo "::endgroup::"

      - name: Kernel Source Fixups (FS magic guards)
        run: |
          set -euo pipefail
          echo "::group::Kernel Source Fixups"
          
          cd kernel_workspace/kernel_platform/common
          
          TARGET="mm/cont_pte_hugepage.c"
          MAGIC_HEADER="include/uapi/linux/magic.h"
          BACKUP_SUFFIX=".ci-backup"
          ALLOW_NUMERIC_FALLBACKS="${ALLOW_NUMERIC_FALLBACKS:-1}"
          SENTINEL_MARKER="CI: FS magic compatibility block"
          
          has_magic_definitions_in_header() {
            local file="$1"
            grep -qE '^[[:space:]]*#define[[:space:]]+EROFS_SUPER_MAGIC_V1\b' "$file" 2>/dev/null || \
            grep -qE '^[[:space:]]*#define[[:space:]]+EXT4_SUPER_MAGIC\b' "$file" 2>/dev/null
          }
          
          has_compatibility_block() {
            local file="$1"
            grep -q "$SENTINEL_MARKER" "$file" 2>/dev/null
          }
          
          needs_magic_include() {
            local file="$1"
            ! grep -qE '^[[:space:]]*#include[[:space:]]*<linux/magic\.h>' "$file"
          }
          
          if [ ! -f "$TARGET" ]; then
            echo "ℹ️  $TARGET not present in this kernel version"
            echo "   This is expected for kernels without OGKI conversion patches"
            echo "::endgroup::"
            exit 0
          fi
          
          echo "🔧 Applying source fixups to: $TARGET"
          echo "   Kernel version: ${KERNEL_VERSION:-unknown}"
          echo "   Allow numeric fallbacks: $ALLOW_NUMERIC_FALLBACKS"
          echo ""
          
          cp "$TARGET" "${TARGET}${BACKUP_SUFFIX}"
          echo "📦 Backup created: ${TARGET}${BACKUP_SUFFIX}"
          echo ""
          
          if needs_magic_include "$TARGET"; then
            echo "  → Adding #include <linux/magic.h>"
            
            awk '
              BEGIN { 
                last_inc = 0
                inserted = 0
              }
              {
                if ($0 ~ /^[[:space:]]*#include[[:space:]]*[<"]/) {
                  print
                  last_inc = NR
                  next
                }
                
                if (!inserted && last_inc > 0 && NR == last_inc + 1) {
                  print ""
                  print "#include <linux/magic.h>"
                  print ""
                  inserted = 1
                }
                
                print
              }
              END {
                if (!inserted && last_inc == 0) {
                  print ""
                  print "#include <linux/magic.h>"
                  print ""
                }
              }
            ' "$TARGET" > "$TARGET.tmp"
            
            if [ -s "$TARGET.tmp" ]; then
              mv "$TARGET.tmp" "$TARGET"
              echo "  ✅ Successfully added #include <linux/magic.h>"
            else
              echo "  ❌ Failed to add include, restoring backup"
              mv "${TARGET}${BACKUP_SUFFIX}" "$TARGET"
              exit 1
            fi
            
            if ! grep -qE '^[[:space:]]*#include[[:space:]]*<linux/magic\.h>' "$TARGET"; then
              echo "  ⚠️ Include not found after insertion, forcing prepend..."
              { printf '#include <linux/magic.h>\n\n'; cat "$TARGET"; } > "$TARGET.tmp" && mv "$TARGET.tmp" "$TARGET"
            fi
          else
            echo "  ✅ #include <linux/magic.h> already present"
          fi
          
          if has_compatibility_block "$TARGET"; then
            echo "  ✅ Compatibility block already present (sentinel found)"
            NEEDS_FALLBACK=false
          else
            NEEDS_FALLBACK=false
            
            if [ -f "$MAGIC_HEADER" ]; then
              if ! has_magic_definitions_in_header "$MAGIC_HEADER"; then
                NEEDS_FALLBACK=true
                echo "  ⚠️  Magic numbers not defined in $MAGIC_HEADER"
              else
                echo "  ✅ Magic numbers found in $MAGIC_HEADER"
              fi
            else
              NEEDS_FALLBACK=true
              echo "  ⚠️  $MAGIC_HEADER not found"
            fi
          fi
          
          if [ "$NEEDS_FALLBACK" = true ]; then
            echo "  → Adding compatibility fallback definitions"
            
            ADD_NUMERIC="$ALLOW_NUMERIC_FALLBACKS"
            if [ -f "$MAGIC_HEADER" ] && [ "$ALLOW_NUMERIC_FALLBACKS" = "0" ]; then
              echo "  ℹ️  Header exists, skipping numeric fallbacks (ALLOW_NUMERIC_FALLBACKS=0)"
              ADD_NUMERIC="0"
            fi
            
            awk -v add_numeric="$ADD_NUMERIC" -v sentinel="$SENTINEL_MARKER" '
              BEGIN { inserted = 0 }
              {
                if ($0 ~ /CI: FS magic compatibility block/) {
                  inserted = 1
                }
                
                print
                
                if (!inserted && $0 ~ /^[[:space:]]*#include[[:space:]]*<linux\/magic\.h>/) {
                  print ""
                  print "/*"
                  print " * " sentinel
                  print " * Ensures filesystem magic visibility across kernel variants."
                  print " * Prefers aliasing to vendor values over introducing new numerics."
                  print " */"
                  print ""
                  
                  print "#ifndef EROFS_SUPER_MAGIC_V1"
                  print "#ifdef EROFS_SUPER_MAGIC"
                  print "#define EROFS_SUPER_MAGIC_V1 EROFS_SUPER_MAGIC"
                  print "#else"
                  
                  if (add_numeric == "1") {
                    print "/* Fallback: use canonical upstream value */"
                    print "#define EROFS_SUPER_MAGIC 0xE0F5E1E2"
                    print "#define EROFS_SUPER_MAGIC_V1 EROFS_SUPER_MAGIC"
                  } else {
                    print "/* EROFS_SUPER_MAGIC undefined and numeric fallbacks disabled */"
                  }
                  
                  print "#endif"
                  print "#endif"
                  print ""
                  
                  if (add_numeric == "1") {
                    print "#ifndef EXT4_SUPER_MAGIC"
                    print "#define EXT4_SUPER_MAGIC 0xEF53"
                    print "#endif"
                    print ""
                  }
                  
                  if (add_numeric == "1") {
                    print "#ifndef F2FS_SUPER_MAGIC"
                    print "#define F2FS_SUPER_MAGIC 0xF2F52010"
                    print "#endif"
                    print ""
                  }
                  
                  if (add_numeric == "1") {
                    print "#ifndef BTRFS_SUPER_MAGIC"
                    print "#define BTRFS_SUPER_MAGIC 0x9123683E"
                    print "#endif"
                    print ""
                  }
                  
                  inserted = 1
                }
              }
            ' "$TARGET" > "$TARGET.tmp"
            
            if [ -s "$TARGET.tmp" ]; then
              mv "$TARGET.tmp" "$TARGET"
              echo "  ✅ Successfully added fallback definitions"
            else
              echo "  ❌ Failed to add fallbacks, restoring backup"
              mv "${TARGET}${BACKUP_SUFFIX}" "$TARGET"
              exit 1
            fi
          fi
          
          echo ""
          echo "📋 Verification Results:"
          
          VERIFICATION_PASSED=true
          
          if grep -qE '^[[:space:]]*#include[[:space:]]*<linux/magic\.h>' "$TARGET"; then
            echo "  ✅ linux/magic.h included"
          else
            echo "  ❌ linux/magic.h NOT included"
            VERIFICATION_PASSED=false
          fi
          
          MAGIC_NUMBERS=("EROFS_SUPER_MAGIC_V1" "EXT4_SUPER_MAGIC" "F2FS_SUPER_MAGIC")
          for magic in "${MAGIC_NUMBERS[@]}"; do
            if grep -Eq "(^|[^A-Za-z0-9_])$magic([^A-Za-z0-9_]|$)" "$TARGET" || \
               grep -qE "^[[:space:]]*#define[[:space:]]+$magic\b" "$MAGIC_HEADER" 2>/dev/null; then
              echo "  ✅ $magic available"
            else
              echo "  ⚠️  $magic might be missing (non-fatal)"
            fi
          done
          
          if has_compatibility_block "$TARGET"; then
            echo "  ✅ Compatibility block sentinel present"
          fi
          
          if command -v git >/dev/null 2>&1; then
            echo ""
            echo "📝 Changes applied:"
            
            if ! git diff --no-index --color=always "${TARGET}${BACKUP_SUFFIX}" "$TARGET" 2>/dev/null; then
              diff -u "${TARGET}${BACKUP_SUFFIX}" "$TARGET" 2>/dev/null || true
            fi
            
            if ! git diff --quiet -- "$TARGET" 2>/dev/null; then
              git add "$TARGET" 2>/dev/null || true
              git commit -m "CI: FS magic number visibility for OGKI conversion" \
                         -m "- Added #include <linux/magic.h>" \
                         -m "- Added compatibility definitions with vendor value aliasing" \
                         -m "- Required for mm/cont_pte_hugepage.c compilation" \
                         -m "" \
                         -m "Aliasing strategy:" \
                         -m "  EROFS_SUPER_MAGIC_V1 → EROFS_SUPER_MAGIC (if available)" \
                         -m "  Numeric fallbacks: $ALLOW_NUMERIC_FALLBACKS" \
                         --no-verify 2>/dev/null || true
              echo "  ✅ Changes committed to git"
            else
              echo "  ℹ️  No changes to commit"
            fi
          fi
          
          if [ "$VERIFICATION_PASSED" = true ]; then
            rm -f "${TARGET}${BACKUP_SUFFIX}"
            echo ""
            echo "✅ All fixups applied and verified successfully"
          else
            echo ""
            echo "⚠️  Some verifications failed, but continuing build"
            echo "   Backup preserved at: ${TARGET}${BACKUP_SUFFIX}"
          fi
          
          echo ""
          echo "::endgroup::"        
     
      - name: Add SukiSU Ultra
        run: |
          cd kernel_workspace/kernel_platform

          META="${{ github.event.inputs.KSU_META }}"

          if [[ "$(grep -o '/' <<< "$META" | wc -l)" -lt 2 ]]; then
            echo "❌ 错误: KSU_META 参数缺少必要的分隔符 '/'"
            echo "格式应为: 分支名/自定义标识(可省略)/提交hash(可省略)"
            echo "示例: susfs-main/Numbersf/abc123"
            exit 10
          fi

          IFS='/' read -r BRANCH_NAME CUSTOM_TAG MANUAL_HASH <<< "$META"

          echo "::group::KernelSU Configuration"
          echo "分支名: $BRANCH_NAME"
          [[ -n "$CUSTOM_TAG" ]] && echo "自定义版本标识: $CUSTOM_TAG" || echo "自定义版本标识: 未启用"
          [[ -n "$MANUAL_HASH" ]] && echo "手动指定 hash: $MANUAL_HASH" || echo "手动指定 hash: 未启用"
          echo "::endgroup::"

          echo "→ Setting up KernelSU via setup.sh..."
          if ! curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s "$BRANCH_NAME"; then
            echo "::error::Failed to setup KernelSU"
            exit 1
          fi

          cd ./KernelSU

          if [[ -n "$MANUAL_HASH" ]]; then
            echo "→ Checking out commit: $MANUAL_HASH"
            
            if ! git rev-parse "$MANUAL_HASH" >/dev/null 2>&1; then
              echo "  Fetching more history..."
              git fetch origin "$BRANCH_NAME" --depth=50 || {
                echo "::warning::Failed to fetch hash $MANUAL_HASH, using branch HEAD"
                MANUAL_HASH=""
              }
            fi
            
            if [[ -n "$MANUAL_HASH" ]]; then
              git checkout "$MANUAL_HASH" || {
                echo "::warning::Checkout failed, using branch HEAD"
                MANUAL_HASH=""
              }
              SHORT_HASH=${MANUAL_HASH:0:8}
            fi
          fi

          KSU_API_VERSION=$(curl -fsSL "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/$BRANCH_NAME/kernel/Makefile" | \
            grep -m1 "KSU_VERSION_API :=" | awk -F'= ' '{print $2}' | tr -d '[:space:]')
          
          if [[ -z "$KSU_API_VERSION" || "$(printf '%s\n' "$KSU_API_VERSION" "3.1.7" | sort -V | head -n1)" != "3.1.7" ]]; then
            KSU_API_VERSION="3.1.7"
          fi
          echo "KSU_API_VERSION=$KSU_API_VERSION" >> $GITHUB_ENV

          GIT_HASH=$(git rev-parse --short HEAD)
          echo "Current HEAD: $GIT_HASH"

          if [[ -n "$MANUAL_HASH" ]]; then
            USE_HASH="$SHORT_HASH"
          else
            USE_HASH="$GIT_HASH"
          fi
          
          if [[ -z "$CUSTOM_TAG" ]]; then
            VERSION_FULL="v$KSU_API_VERSION-$USE_HASH@$BRANCH_NAME"
          else
            VERSION_FULL="v$KSU_API_VERSION-$CUSTOM_TAG@$BRANCH_NAME[$USE_HASH]"
          fi

          sed -i '/define get_ksu_version_full/,/endef/d' kernel/Makefile
          sed -i '/KSU_VERSION_API :=/d' kernel/Makefile
          sed -i '/KSU_VERSION_FULL :=/d' kernel/Makefile

          VERSION_DEFINITIONS=$(cat <<EOF
            define get_ksu_version_full
            $VERSION_FULL
            endef

            KSU_VERSION_API := $KSU_API_VERSION
            KSU_VERSION_FULL := $VERSION_FULL
          EOF
          )

          awk -v def="$VERSION_DEFINITIONS" '
            /REPO_OWNER :=/ {print; print def; inserted=1; next}
            1
            END {if (!inserted) print def}
          ' kernel/Makefile > kernel/Makefile.tmp && mv kernel/Makefile.tmp kernel/Makefile

          KSU_VERSION=$(expr $(git rev-list --count main 2>/dev/null || echo 13000) + 37185)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV

          echo "::group::Makefile Version Info"
          grep -A10 "REPO_OWNER" kernel/Makefile
          grep "KSU_VERSION_FULL" kernel/Makefile
          echo "::endgroup::"
          
          echo "✅ KernelSU setup complete: $VERSION_FULL"

      - name: Detect and Set Clang Version
        id: clang_detect
        run: |
          set -euo pipefail
          echo "::group::Detect Clang Version"
          
          cd kernel_workspace/kernel_platform
          
          CLANG_VERSION=""
          CONFIG_FILES=(
            "./common/build.config.constants"
            "./common/build.config.common"
            "./common/build.config.gki"
            "./common/build.config.gki.aarch64"
            "./build.config.constants"
            "./build.config.common"
          )
          
          echo "🔍 Searching for CLANG_VERSION in build configs..."
          
          for config_file in "${CONFIG_FILES[@]}"; do
            if [ -f "$config_file" ]; then
              echo "  Checking: $config_file"
              
              CLANG_VERSION=$(grep -m1 -E '^\s*CLANG_VERSION\s*=' "$config_file" 2>/dev/null | \
                cut -d= -f2 | tr -d ' "' || true)
              
              if [ -z "$CLANG_VERSION" ]; then
                CLANG_VERSION=$(grep -m1 -E '^\s*export\s+CLANG_VERSION\s*=' "$config_file" 2>/dev/null | \
                  cut -d= -f2 | tr -d ' "' || true)
              fi
              
              if [ -n "$CLANG_VERSION" ]; then
                echo "  ✅ Found CLANG_VERSION=$CLANG_VERSION in $config_file"
                break
              fi
            fi
          done
          
          if [ -n "$CLANG_VERSION" ]; then
            if [[ ! "$CLANG_VERSION" =~ ^clang- ]]; then
              echo "  → Normalizing version: $CLANG_VERSION → clang-$CLANG_VERSION"
              CLANG_VERSION="clang-$CLANG_VERSION"
            fi
          fi
          
          if [ -z "$CLANG_VERSION" ]; then
            echo "⚠️ CLANG_VERSION not found in configs, detecting from prebuilts..."
            
            PREBUILTS_DIR="./prebuilts/clang/host/linux-x86"
            
            if [ -d "$PREBUILTS_DIR" ]; then
              CLANG_VERSION=$(ls -1 "$PREBUILTS_DIR" 2>/dev/null | \
                grep -E '^clang-r[0-9]+' | sort -V | tail -n1 || true)
              
              if [ -n "$CLANG_VERSION" ]; then
                echo "  ✅ Auto-detected from prebuilts: $CLANG_VERSION"
              fi
            fi
          fi
          
          if [ -z "$CLANG_VERSION" ]; then
            echo "::error::Failed to detect CLANG_VERSION"
            echo "::group::Available Clang versions"
            ls -1 ./prebuilts/clang/host/linux-x86/ 2>/dev/null || echo "Prebuilts directory not found"
            echo "::endgroup::"
            exit 1
          fi
          
          CLANG_PATH="./prebuilts/clang/host/linux-x86/${CLANG_VERSION}/bin"
          
          if [ ! -d "$CLANG_PATH" ]; then
            echo "::error::Clang path does not exist: $CLANG_PATH"
            echo "::group::Available paths"
            find ./prebuilts/clang/host/linux-x86 -maxdepth 2 -type d -name "bin" 2>/dev/null || true
            echo "::endgroup::"
            
            echo "::group::Attempting emergency fallback"
            FALLBACK_CLANG=$(find ./prebuilts/clang/host/linux-x86 -maxdepth 1 -type d -name "clang-r*" | head -n1)
            if [ -n "$FALLBACK_CLANG" ]; then
              CLANG_VERSION=$(basename "$FALLBACK_CLANG")
              CLANG_PATH="$FALLBACK_CLANG/bin"
              echo "⚠️ Using fallback: $CLANG_VERSION"
              echo "::endgroup::"
            else
              echo "::endgroup::"
              exit 1
            fi
          fi
          
          if [ ! -f "$CLANG_PATH/clang" ]; then
            echo "::error::clang binary not found at: $CLANG_PATH/clang"
            exit 1
          fi
          
          CLANG_FULL_PATH="${GITHUB_WORKSPACE}/kernel_workspace/kernel_platform/prebuilts/clang/host/linux-x86/${CLANG_VERSION}/bin"
          
          echo "CLANG_VERSION=$CLANG_VERSION" >> $GITHUB_ENV
          echo "CLANG_PATH=$CLANG_FULL_PATH" >> $GITHUB_ENV
          
          GCC_PATH="${GITHUB_WORKSPACE}/kernel_workspace/kernel_platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin"
          GCC32_PATH="${GITHUB_WORKSPACE}/kernel_workspace/kernel_platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/bin"
          
          echo "GCC_PATH=$GCC_PATH" >> $GITHUB_ENV
          echo "GCC32_PATH=$GCC32_PATH" >> $GITHUB_ENV
          
          CLANG_ACTUAL_VERSION=$("$CLANG_PATH/clang" --version 2>/dev/null | head -n1 || echo "Unknown")
          
          echo ""
          echo "============================================"
          echo "✅ Clang Configuration"
          echo "============================================"
          echo "Detected Version: $CLANG_VERSION"
          echo "Clang Path: $CLANG_FULL_PATH"
          echo "Actual Version: $CLANG_ACTUAL_VERSION"
          echo "GCC Path: $GCC_PATH"
          echo "GCC32 Path: $GCC32_PATH"
          echo "============================================"
          echo ""
          
          echo "clang_version=$CLANG_VERSION" >> $GITHUB_OUTPUT
          echo "clang_path=$CLANG_FULL_PATH" >> $GITHUB_OUTPUT
          
          echo "::endgroup::"

      - name: Apply Patches SukiSU Ultra
        env:
          FILE: ${{ github.event.inputs.FILE }}
        run: |
          set -euo pipefail
          echo "::group::Apply patches"
          
          cd kernel_workspace
          
          echo "📥 Cloning susfs4ksu..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git \
            -b gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}
          
          echo "📥 Cloning SukiSU_patch..."
          git clone --depth=1 https://github.com/ShirkNeko/SukiSU_patch.git
          
          cd kernel_platform
          
          echo "📋 Copying susfs patches..."
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch ./common/
          cp ../susfs4ksu/kernel_patches/fs/* ./common/fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/

          if [ "${{ github.event.inputs.ZRAM }}" = "true" ]; then
            echo "📋 Copying ZRAM patches..."
            cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./common/include/linux/
            cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./common/lib/
            cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./common/crypto/
            cp -r ../SukiSU_patch/other/zram/lz4k_oplus ./common/lib/
          fi

          cd ./common
          GKI_V="${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}"
          SUBLEVEL=$(grep '^SUBLEVEL *=' Makefile | head -n1 | cut -d= -f2 | tr -d ' ')

          if [ "$GKI_V" == "android13-5.15" ] && [ "$SUBLEVEL" -lt 123 ]; then
            echo "🔧 Applying 5.15 legacy fix..."
            curl -fsSLo fix_5.15.legacy.patch --retry 3 \
              https://raw.githubusercontent.com/Numbersf/Action-Build/SukiSU-Ultra/patches/fix_5.15.legacy
            patch -p1 < fix_5.15.legacy.patch
            echo "✅ 5.15 legacy fix applied"
          fi
          
          KERNEL_VERSION="${{ env.KERNEL_VERSION }}"
          TKERNEL_VERSION="${{ env.TKERNEL_VERSION }}"
          if [[ "$KERNEL_VERSION" == "6.6" ]]; then
            TRUSTY_EXISTS="false"
            if grep -q 'common-modules/trusty' "$GITHUB_WORKSPACE/.repo/manifests_fallback/${FILE}.xml"; then
              TRUSTY_EXISTS="true"
            fi
            
            if [[ "$TRUSTY_EXISTS" == "false" && "$(printf '%s\n' "$TKERNEL_VERSION" "6.6.30" | sort -V | head -n1)" = "$TKERNEL_VERSION" ]]; then
              echo "🔧 Fixing Trusty OS absence for 6.6..."
              sed -i 's/-32,12 +32,38/-32,11 +32,37/g' 50_add_susfs_in_gki-${{ env.KANDROID_VERSION }}-${KERNEL_VERSION}.patch
              sed -i '/#include <trace\/hooks\/fs.h>/d' 50_add_susfs_in_gki-${{ env.KANDROID_VERSION }}-${KERNEL_VERSION}.patch
            fi
          fi
          
          fake_patched=0
          if [ "$GKI_V" = "android15-6.6" ]; then
            if ! grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
              echo "🔧 Applying fake patch for android15-6.6..."
              sed -i -e '/int ret = 0, copied = 0;/a \\tunsigned int nr_subpages \= __PAGE_SIZE \/ PAGE_SIZE;' \
                     -e '/int ret = 0, copied = 0;/a \\tpagemap_entry_t \*res = NULL;' ./fs/proc/task_mmu.c
              fake_patched=1
            fi
          fi

          echo "🔨 Applying susfs patch..."
          if patch -p1 --forward --no-backup-if-mismatch < 50_add_susfs_in_gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch; then
            echo "✅ susfs patch applied"
          else
            echo "⚠️ susfs patch failed or already applied"
          fi

          if [ "$fake_patched" = 1 ]; then
            if [ "$GKI_V" = "android15-6.6" ]; then
              if grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
                sed -i -e '/unsigned int nr_subpages \= __PAGE_SIZE \/ PAGE_SIZE;/d' \
                       -e '/pagemap_entry_t \*res = NULL;/d' ./fs/proc/task_mmu.c
              fi
            fi
          fi
          
          echo "::endgroup::"

      - name: Apply Hide Stuff Patches
        run: |
          cd kernel_workspace/kernel_platform/common
          cp ../../SukiSU_patch/69_hide_stuff.patch ./
          echo "→ Applying hide stuff patch..."
          patch -p1 -F 3 < 69_hide_stuff.patch
          echo "✅ Hide stuff patch applied"

      - name: Apply Convert HMBIRD_OGKI to HMBIRD_GKI
        if: ${{ env.KERNEL_VERSION == '6.6' && github.event.inputs.SCHED == 'false' }}
        run: |
          cd kernel_workspace/kernel_platform/common
          sed -i '1iobj-y += hmbird_patch.o' drivers/Makefile
          wget https://github.com/Numbersf/Action-Build/raw/SukiSU-Ultra/patches/hmbird_patch.patch
          echo "→ Applying OGKI to GKI conversion patch..."
          patch -p1 -F 3 < hmbird_patch.patch
          echo "✅ OGKI to GKI conversion complete"

      - name: Apply HOOK
        run: |
          cd kernel_workspace/kernel_platform/common
          
          case "${{ github.event.inputs.HOOK }}" in
            kprobe)
              echo "→ Using kprobe hooks (no patch needed)"
              ;;
            manual)
              echo "→ Applying manual hooks..."
              cp ../../SukiSU_patch/hooks/scope_min_manual_hooks_v1.6.patch ./
              patch -p1 -F 3 < scope_min_manual_hooks_v1.6.patch
              echo "✅ Manual hooks applied"
              ;;
            tracepoint)
              echo "→ Applying tracepoint hooks..."
              cp ../../SukiSU_patch/hooks/sukisu_tracepoint_hooks_v1.1.patch ./
              patch -p1 -F 3 < sukisu_tracepoint_hooks_v1.1.patch
              echo "✅ Tracepoint hooks applied"
              ;;
          esac

      - name: Apply ZRAM
        if: ${{ github.event.inputs.ZRAM == 'true' }}
        run: |
          cd kernel_workspace/kernel_platform/common
          
          echo "::group::Apply LZ4KD patch"
          cp ../../SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}/lz4kd.patch ./
          patch -p1 -F 3 < lz4kd.patch || true
          echo "::endgroup::"
          
          echo "::group::Apply LZ4K_OPLUS patch"
          cp ../../SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}/lz4k_oplus.patch ./
          patch -p1 -F 3 < lz4k_oplus.patch || true
          echo "::endgroup::"
          
          echo "✅ ZRAM patches applied"

      - name: Apply SCHED
        env:
          FILE: ${{ github.event.inputs.FILE }}
        if: ${{ github.event.inputs.SCHED == 'true' }}
        run: |
          cd kernel_workspace/kernel_platform/common
          
          echo "→ Cloning SCHED patches for ${{ env.CPU }}..."
          git clone --depth=1 https://github.com/Numbersf/SCHED_PATCH.git -b ${{ env.CPU }}
          
          PATCH_FILE="./SCHED_PATCH/fengchi_${FILE}.patch"
          
          if [[ -f "$PATCH_FILE" ]]; then
            echo "→ Applying SCHED patch..."
            dos2unix "$PATCH_FILE"
            patch -p1 -F 3 < "$PATCH_FILE"
            echo "✅ SCHED patch applied"
          else
            echo "::error::❌ SCHED patch not found for device: ${FILE}"
            echo "Available patches:"
            ls -1 ./SCHED_PATCH/*.patch 2>/dev/null || echo "No patches found"
            exit 11
          fi

      - name: Apply LSM_BBG
        if: ${{ github.event.inputs.LSM == 'true' }}
        run: |
          cd kernel_workspace/kernel_platform/common
          echo "→ Enabling kernel-level baseband protection..."
          curl -LSs https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/main/setup.sh | bash
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/lockdown/lockdown,baseband_guard/ } }' ./security/Kconfig
          echo "✅ LSM baseband guard enabled"

      - name: Add Configuration Settings
        run: |
          cd kernel_workspace/kernel_platform
          CONFIG_FILE=./common/arch/arm64/configs/gki_defconfig

          echo "::group::KernelSU Configuration"
          echo "CONFIG_KSU=y" >> "$CONFIG_FILE"
          echo "CONFIG_KPM=y" >> "$CONFIG_FILE"
          echo "::endgroup::"

          echo "::group::Hook Configuration"
          case "${{ github.event.inputs.HOOK }}" in
            kprobe)
              {
                echo "CONFIG_KSU_SUSFS_SUS_SU=y"
                echo "CONFIG_KPROBES=y"
                echo "CONFIG_KSU_KPROBES_HOOK=y"
              } >> "$CONFIG_FILE"
              ;;
            manual)
              {
                echo "CONFIG_KSU_SUSFS_SUS_SU=n"
                echo "CONFIG_KSU_MANUAL_HOOK=y"
              } >> "$CONFIG_FILE"
              ;;
            tracepoint)
              {
                echo "CONFIG_KSU_SUSFS_SUS_SU=n"
                echo "CONFIG_KSU_TRACEPOINT_HOOK=y"
              } >> "$CONFIG_FILE"
              ;;
          esac
          echo "::endgroup::"

          echo "::group::SUSFS Configuration"
          {
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
          } >> "$CONFIG_FILE"
          echo "::endgroup::"

          echo "::group::Network Optimizations"
          {
            echo "CONFIG_TMPFS_XATTR=y"
            echo "CONFIG_TMPFS_POSIX_ACL=y"
            echo "CONFIG_TCP_CONG_ADVANCED=y"
            echo "CONFIG_TCP_CONG_BBR=y"
            echo "CONFIG_NET_SCH_FQ=y"
            echo "CONFIG_TCP_CONG_BIC=n"
            echo "CONFIG_TCP_CONG_WESTWOOD=n"
            echo "CONFIG_TCP_CONG_HTCP=n"
            echo "CONFIG_IP_ECN=y"
            echo "CONFIG_TCP_ECN=y"
            echo "CONFIG_IPV6_ECN=y"
            echo "CONFIG_IP_NF_TARGET_ECN=y"            
            echo "CONFIG_LTO_CLANG_THIN=y"
            echo "CONFIG_LTO_CLANG=y"
            echo "CONFIG_OPTIMIZE_INLINING=y"        
          } >> "$CONFIG_FILE"
          echo "::endgroup::"

          echo "# CONFIG_LOCALVERSION_AUTO is not set" >> "$CONFIG_FILE"

          if [ "${{ github.event.inputs.ZRAM }}" = "true" ]; then
            echo "::group::ZRAM Configuration"
            {
              echo "CONFIG_CRYPTO_LZ4HC=y"
              echo "CONFIG_CRYPTO_LZ4K=y"
              echo "CONFIG_CRYPTO_LZ4KD=y"
              echo "CONFIG_CRYPTO_842=y"
              echo "CONFIG_CRYPTO_LZ4K_OPLUS=y"
              echo "CONFIG_ZRAM_WRITEBACK=y"
            } >> "$CONFIG_FILE"
            echo "::endgroup::"
          fi

          if [ "${{ github.event.inputs.LSM }}" = "true" ]; then
            echo "::group::LSM Configuration"
            echo "CONFIG_BBG=y" >> "$CONFIG_FILE"
            echo "::endgroup::"
          fi

          sed -i 's/check_defconfig//' ./common/build.config.gki
          
          echo "✅ All configurations applied"

      - name: Customize Kernel Branding
        run: |
          set -euo pipefail
          echo "::group::Configure kernel version string"
          
          cd kernel_workspace/kernel_platform/common
          
          ANDROID_BASE="${{ env.KANDROID_VERSION }}"
          
          if [ -z "$ANDROID_BASE" ]; then
            echo "::error::KANDROID_VERSION not set"
            exit 1
          fi
          
          CUSTOM_BRAND="-${ANDROID_BASE}-OP-Numbersf"
          
          echo "$CUSTOM_BRAND" > .scmversion
          echo "✅ Created .scmversion: $(cat .scmversion)"
          
          sed -i 's/CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/' \
            arch/arm64/configs/gki_defconfig 2>/dev/null || true
          
          if [ -f "scripts/setlocalversion" ]; then
            cat > scripts/setlocalversion << 'EOF'
          #!/bin/sh
          echo ""
          EOF
            chmod +x scripts/setlocalversion
            echo "✅ setlocalversion neutralized"
          fi
          
          {
            echo "SOURCE_DATE_EPOCH=$(date +%s)"
            echo "KBUILD_BUILD_TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "KBUILD_BUILD_USER=builder"
            echo "KBUILD_BUILD_HOST=github-actions"
            echo "CUSTOM_LOCALVERSION=$CUSTOM_BRAND"
          } >> $GITHUB_ENV
          
          KERNEL_VER=$(make kernelversion 2>/dev/null || echo "${{ env.TKERNEL_VERSION }}")
          
          echo ""
          echo "============================================"
          echo "📋 Kernel Version Configuration"
          echo "============================================"
          echo "Kernel Version: $KERNEL_VER"
          echo "Android Base: $ANDROID_BASE"
          echo "Custom Brand: $CUSTOM_BRAND"
          echo ""
          echo "Expected format: ${KERNEL_VER}${CUSTOM_BRAND}"
          echo "Example: 6.1.118-android14-OP-Numbersf"
          echo "============================================"
          
          echo "::endgroup::"

      - name: Force LOCALVERSION in Build Configs
        run: |
          set -euo pipefail
          echo "::group::Force LOCALVERSION in build configs"
          
          cd kernel_workspace/kernel_platform
          
          for config in $(find . -name "build.config*" -type f); do
            if grep -q "LOCALVERSION=" "$config" 2>/dev/null; then
              echo "→ Updating $config"
              sed -i "s|^LOCALVERSION=.*|LOCALVERSION=${{ env.CUSTOM_LOCALVERSION }}|" "$config"
            else
              echo "→ Adding LOCALVERSION to $config"
              echo "LOCALVERSION=${{ env.CUSTOM_LOCALVERSION }}" >> "$config"
            fi
          done
          
          if [ -f common/Makefile ]; then
            if grep -q "^LOCALVERSION" common/Makefile; then
              sed -i "s|^LOCALVERSION.*|LOCALVERSION = ${{ env.CUSTOM_LOCALVERSION }}|" common/Makefile
            else
              echo "LOCALVERSION = ${{ env.CUSTOM_LOCALVERSION }}" >> common/Makefile
            fi
          fi
          
          echo "✅ LOCALVERSION forced in all build configs"
          echo "::endgroup::"

      - name: Build Kernel FAST
        if: github.event.inputs.FAST_BUILD == 'true'
        id: fast_build
        working-directory: kernel_workspace/kernel_platform/common
        run: |
          set -euo pipefail
          
          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_DIR="$CCACHE_DIR"
          
          if [ "${{ github.event.inputs.clean }}" != "true" ]; then
            export CC="ccache clang"
            export CXX="ccache clang++"
            export HOSTCC="ccache clang"
            export HOSTCXX="ccache clang++"
            echo "✅ ccache wrappers enabled for all compilers"
          else
            echo "⚠️ Clean build - ccache disabled"
          fi
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          CLANG_PATH="${{ env.CLANG_PATH }}"
          GCC_PATH="${{ env.GCC_PATH }}"
          GCC32_PATH="${{ env.GCC32_PATH }}"
          
          if [ -z "$CLANG_PATH" ] || [ ! -d "$CLANG_PATH" ]; then
            echo "::error::CLANG_PATH not set or invalid: $CLANG_PATH"
            echo "This usually means the 'Detect and Set Clang Version' step failed"
            exit 1
          fi
          
          export PATH="$CLANG_PATH:$GCC_PATH:$GCC32_PATH:$PATH"
          
          if ! command -v clang >/dev/null 2>&1; then
            echo "::error::Clang not found in PATH after setup"
            echo "PATH=$PATH"
            echo "CLANG_PATH=$CLANG_PATH"
            exit 1
          fi
          
          CLANG_VERSION_OUTPUT=$(clang --version | head -n1)
          echo "============================================"
          echo "🔧 Build Toolchain"
          echo "============================================"
          echo "Clang: $CLANG_VERSION_OUTPUT"
          echo "Clang Path: $CLANG_PATH"
          echo "GCC Path: $GCC_PATH"
          echo "GCC32 Path: $GCC32_PATH"
          echo "Detected Version: ${{ env.CLANG_VERSION }}"
          echo "============================================"
          echo ""
          
          MAKE_ARGS=(
            "ARCH=arm64"
            "SUBARCH=arm64"
            "LD=ld.lld"
            "AR=llvm-ar"
            "NM=llvm-nm"
            "OBJCOPY=llvm-objcopy"
            "OBJDUMP=llvm-objdump"
            "READELF=llvm-readelf"
            "STRIP=llvm-strip"
            "LLVM=1"
            "LLVM_IAS=1"
            "CLANG_TRIPLE=aarch64-linux-gnu-"
            "CROSS_COMPILE=aarch64-linux-gnu-"
            "CROSS_COMPILE_COMPAT=arm-linux-gnueabi-"
          )
          
          if [ "${{ github.event.inputs.clean }}" != "true" ]; then
            MAKE_ARGS+=(
              "CC=ccache clang"
              "CXX=ccache clang++"
              "HOSTCC=ccache clang"
              "HOSTCXX=ccache clang++"
            )
            echo "✅ ccache wrappers added to MAKE_ARGS"
          else
            MAKE_ARGS+=(
              "CC=clang"
              "CXX=clang++"
              "HOSTCC=clang"
              "HOSTCXX=clang++"
            )
            echo "⚠️ Clean build - using direct compiler invocation"
          fi
          
          if [ "${{ github.event.inputs.optimize_level }}" = "O3" ]; then
            MAKE_ARGS+=("KCFLAGS=-O3")
            echo "⚡ Using -O3 optimization"
          else
            echo "⚡ Using -O2 optimization (default)"
          fi
          
          if [ "${{ github.event.inputs.clean }}" != "true" ]; then
            echo ""
            echo "============================================"
            echo "📦 ccache Status"
            echo "============================================"
            echo "Status: ENABLED (3G max)"
            echo ""
            ccache -s | head -n 8
            echo "============================================"
          else
            echo ""
            echo "⚠️ ccache: DISABLED (clean build mode)"
          fi
          
          echo ""
          
          echo "============================================"
          echo "📝 Configuring Kernel"
          echo "============================================"
          
          mkdir -p out
          
          echo "→ Generating gki_defconfig..."
          if ! make O=out "${MAKE_ARGS[@]}" gki_defconfig; then
            echo "::error::Failed to generate defconfig"
            echo "::group::Kconfig error details"
            make O=out "${MAKE_ARGS[@]}" gki_defconfig 2>&1 | tail -50 || true
            echo "::endgroup::"
            exit 1
          fi
          
          CONFIG_FILE="out/.config"
    
          if [ -f "$CONFIG_FILE" ]; then
            scripts/config --file "$CONFIG_FILE" --set-str LOCALVERSION "${{ env.CUSTOM_LOCALVERSION }}"
            scripts/config --file "$CONFIG_FILE" --disable LOCALVERSION_AUTO
            make O=out "${MAKE_ARGS[@]}" olddefconfig
            
            echo ""
            echo "✅ Version configuration applied:"
            grep -E "CONFIG_LOCALVERSION" "$CONFIG_FILE" || echo "LOCALVERSION not found in config"
          else
            echo "::error::.config not found at: $CONFIG_FILE"
            exit 1
          fi
          
          if [ -z "$CONFIG_FILE" ]; then
            echo "::error::.config missing after gki_defconfig"
            echo "This usually indicates a Kconfig syntax error or missing dependencies"
            echo ""
            echo "::group::Debug info"
            echo "Current directory: $(pwd)"
            echo "Output directory contents:"
            ls -laR out/ 2>/dev/null || echo "out/ directory not accessible"
            echo "Root directory .config check:"
            ls -la .config 2>/dev/null || echo "No .config in root"
            echo "::endgroup::"
            exit 1
          fi
          
          if [ "$CONFIG_FILE" != "out/.config" ]; then
            echo "→ Copying .config to out/ directory..."
            cp "$CONFIG_FILE" out/.config
            CONFIG_FILE="out/.config"
          fi
          
          echo ""
          echo "→ Verifying defconfig settings..."
          
          if grep -q "CONFIG_LTO_CLANG_THIN=y" "$CONFIG_FILE"; then
            echo "  ✅ LTO_CLANG_THIN enabled in defconfig"
          else
            echo "  ⚠️ LTO_CLANG_THIN not found (may be disabled or unavailable)"
          fi
          
          if grep -q "CONFIG_OPTIMIZE_INLINING=y" "$CONFIG_FILE"; then
            echo "  ✅ OPTIMIZE_INLINING enabled in defconfig"
          else
            echo "  ℹ️ OPTIMIZE_INLINING not found (may use default)"
          fi
          
          echo ""
          echo "→ Resolving configuration dependencies..."
          echo "  (This may take a moment for kernels with many new options)"
          
          export KCONFIG_NONINTERACTIVE=1
          
          if yes "" | make O=out "${MAKE_ARGS[@]}" oldconfig 2>&1 | \
             tee /tmp/config.log | grep -v "Error in reading"; then
            echo "✅ Configuration resolved successfully"
          else
            echo "⚠️ Configuration completed with warnings (expected in CI)"
          fi
          
          echo ""
          echo "============================================"
          echo "🔨 Building Kernel"
          echo "============================================"
          
          JOBS=$(nproc)
          JOBS=$((JOBS > $(nproc) ? $(nproc) : JOBS))
          
          echo "Build configuration:"
          echo "  Parallel jobs: $JOBS"
          echo "  Optimization: ${{ github.event.inputs.optimize_level }}"
          echo "  Hook type: ${{ github.event.inputs.HOOK }}"
          echo "  Clang version: ${{ env.CLANG_VERSION }}"
          echo "  LOCALVERSION: ${{ env.CUSTOM_LOCALVERSION }}"
          echo ""
          
          BUILD_START=$(date +%s)
          
          if make O=out "${MAKE_ARGS[@]}" \
               LOCALVERSION="${{ env.CUSTOM_LOCALVERSION }}" \
               -j${JOBS} 2>&1 | tee build.log; then
            BUILD_END=$(date +%s)
            BUILD_TIME=$((BUILD_END - BUILD_START))
            
            IMG="out/arch/arm64/boot/Image"
            if [ ! -f "$IMG" ]; then
              echo "::error::Kernel Image missing after successful build"
              echo "::group::Last 100 lines of build log"
              tail -n 100 build.log || echo "Build log not available"
              echo "::endgroup::"
              exit 1
            fi
            
            IMG_SIZE=$(stat -c%s "$IMG")
            IMG_SIZE_HUMAN=$(numfmt --to=iec-i --suffix=B "$IMG_SIZE" 2>/dev/null || echo "${IMG_SIZE}B")
            
            echo ""
            echo "============================================"
            echo "✅ Build Completed Successfully"
            echo "============================================"
            echo "Duration: $((BUILD_TIME / 60))m $((BUILD_TIME % 60))s"
            echo "Image: $IMG_SIZE_HUMAN"
            echo "Clang: ${{ env.CLANG_VERSION }}"
            echo "============================================"
            
            echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_ENV
            
            if [ "${{ github.event.inputs.clean }}" != "true" ]; then
              echo ""
              echo "============================================"
              echo "📊 ccache Post-Build Statistics"
              echo "============================================"
              ccache -s
              
              CACHE_STATS=$(ccache -s 2>/dev/null || echo "")
              if [ -n "$CACHE_STATS" ]; then
                HITS=$(echo "$CACHE_STATS" | grep -i "cache hit" | awk '{print $NF}' | head -1 || echo "0")
                MISSES=$(echo "$CACHE_STATS" | grep -i "cache miss" | awk '{print $NF}' | head -1 || echo "0")
                if [ -n "$HITS" ] && [ -n "$MISSES" ] && [ "$HITS" != "0" ]; then
                  TOTAL=$((HITS + MISSES))
                  if [ "$TOTAL" -gt 0 ]; then
                    HIT_RATE=$(awk "BEGIN {printf \"%.1f\", ($HITS / $TOTAL) * 100}")
                    echo ""
                    echo "Cache Hit Rate: ${HIT_RATE}% ($HITS hits / $TOTAL total)"
                    echo "CCACHE_HIT_RATE=$HIT_RATE" >> $GITHUB_ENV
                  fi
                fi
              fi
              echo "============================================"
              
              DISK_AVAIL=$(df --output=avail / | tail -1)
              if [ "$DISK_AVAIL" -lt 5242880 ]; then
                echo ""
                echo "⚠️ Low disk space detected, running ccache cleanup..."
                ccache -c
                echo "✅ Cache cleanup completed"
              fi
            fi
            
          else
            echo "::error::Kernel build failed"
            echo "::group::Last 200 lines of build log"
            tail -n 200 build.log || echo "Build log not available"
            echo "::endgroup::"
            exit 1
          fi

      - name: Ensure Bazel/Bazelisk Available
        if: ${{ github.event.inputs.FAST_BUILD == 'false' || steps.fast_build.outputs.fallback == 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "::group::Check Bazel availability"
          
          if command -v bazel >/dev/null 2>&1; then
            echo "✅ bazel already available: $(bazel version 2>&1 | head -1)"
            echo "::endgroup::"
            exit 0
          fi
          
          if command -v bazelisk >/dev/null 2>&1; then
            echo "✅ bazelisk already available"
            echo "::endgroup::"
            exit 0
          fi
          
          if [ -f kernel_workspace/kernel_platform/build_with_bazel.py ]; then
            echo "📦 build_with_bazel.py detected, installing bazelisk..."
            
            BAZELISK_VERSION="v1.19.0"
            BAZELISK_URL="https://github.com/bazelbuild/bazelisk/releases/download/${BAZELISK_VERSION}/bazelisk-linux-amd64"
            
            echo "Downloading bazelisk ${BAZELISK_VERSION}..."
            if sudo curl -fsSL --retry 3 --retry-delay 2 -o /usr/local/bin/bazelisk "$BAZELISK_URL"; then
              sudo chmod +x /usr/local/bin/bazelisk
              sudo ln -sf /usr/local/bin/bazelisk /usr/local/bin/bazel
              
              echo "✅ bazelisk installed successfully"
              bazelisk version 2>&1 | head -3 || true
            else
              echo "⚠️ Failed to download bazelisk"
              echo "Build may fail if bazel is required"
              echo "::warning::bazelisk installation failed - fallback build may not work"
            fi
          else
            echo "ℹ️ build_with_bazel.py not found, bazel not required"
          fi
          
          echo "::endgroup::"

      - name: Fallback to Build Kernel
        if: ${{ github.event.inputs.FAST_BUILD == 'false' || steps.fast_build.outputs.fallback == 'true' }}
        run: |
          cd kernel_workspace
          
          export PATH="/usr/lib/ccache:$PATH"
          
          if [ "${{ github.event.inputs.clean }}" != "true" ]; then
            export CC="ccache clang"
            export CXX="ccache clang++"
            export HOSTCC="ccache clang"
            export HOSTCXX="ccache clang++"
            echo "✅ ccache enabled for fallback build"
            ccache -s | head -n 5
          fi
          
          export LOCALVERSION="${{ env.CUSTOM_LOCALVERSION }}"
          
          if [ -f ./kernel_platform/build_with_bazel.py ]; then
            ./kernel_platform/oplus/bazel/oplus_modules_variant.sh ${{ env.CPUD }} ${{ env.BUILD_METHOD }}
            ./kernel_platform/build_with_bazel.py -t ${{ env.CPUD }} ${{ env.BUILD_METHOD }}
          else
            SYSTEM_DLKM_RE_SIGN=0 \
            BUILD_SYSTEM_DLKM=0 \
            KMI_SYMBOL_LIST_STRICT_MODE=0 \
            LOCALVERSION="${{ env.CUSTOM_LOCALVERSION }}" \
            ./kernel_platform/oplus/build/oplus_build_kernel.sh ${{ env.CPUD }} ${{ env.BUILD_METHOD }}
          fi
          
          if [ "${{ github.event.inputs.clean }}" != "true" ]; then
            echo ""
            echo "============================================"
            echo "📊 ccache Post-Build Statistics (Fallback)"
            echo "============================================"
            ccache -s
            echo "============================================"
          fi
      
      - name: Verify Kernel Version Format
        if: always()
        run: |
          set -euo pipefail
          echo "::group::Verify kernel version format"
          
          cd kernel_workspace/kernel_platform/common
          
          IMG=$(find . -type f -name 'Image' -path '*/arch/arm64/boot/*' -print -quit 2>/dev/null)
          
          if [ -z "$IMG" ] || [ ! -f "$IMG" ]; then
            echo "⚠️ Kernel Image not found, skipping verification"
            echo "::endgroup::"
            exit 0
          fi
          
          # Grab the first Linux version line
          VERSION=$(strings "$IMG" | grep -m1 -E "Linux version [0-9]+\.[0-9]+(\.[0-9]+)?")
          
          # Extract full token right after "Linux version " (may include suffix)
          KERNEL_RELEASE=$(echo "$VERSION" | grep -oE 'Linux version [^ ]+' | awk '{print $3}' || echo "")
          
          if [ -z "$KERNEL_RELEASE" ]; then
            echo "::error::Failed to extract kernel version from Image"
            echo "Full version line: ${VERSION:-not found}"
            echo "::endgroup::"
            exit 1
          fi
          
          # Store original for comparison
          ORIGINAL_RELEASE="$KERNEL_RELEASE"
          
          # If only numeric, attach our known LOCALVERSION
          if [[ "$KERNEL_RELEASE" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            SUFFIX="${{ env.CUSTOM_LOCALVERSION }}"
            if [ -z "$SUFFIX" ]; then
              # Fallback if env not present for some reason
              SUFFIX="-${{ env.KANDROID_VERSION }}-OP-Numbersf"
            fi
            KERNEL_RELEASE="${KERNEL_RELEASE}${SUFFIX}"
            echo "ℹ️ Numeric-only version detected, appended suffix"
          fi
          
          echo ""
          echo "============================================"
          echo "✅ Kernel Version Verification"
          echo "============================================"
          echo "Full version line: ${VERSION}"
          echo "Original release: ${ORIGINAL_RELEASE}"
          if [ "$ORIGINAL_RELEASE" != "$KERNEL_RELEASE" ]; then
            echo "Modified release: ${KERNEL_RELEASE}"
          fi
          echo ""
          
          VALIDATION_PASSED=true
          ANDROID_BASE="${{ env.KANDROID_VERSION }}"
          
          # Check 1: No -dirty flag
          if echo "$KERNEL_RELEASE" | grep -q "dirty"; then
            echo "❌ FAIL: Version contains -dirty flag"
            VALIDATION_PASSED=false
          else
            echo "✅ PASS: No -dirty flag"
          fi
          
          # Check 2: Contains Android base
          if echo "$KERNEL_RELEASE" | grep -q "$ANDROID_BASE"; then
            echo "✅ PASS: Android base present ($ANDROID_BASE)"
          else
            echo "❌ FAIL: Android base not found (expected: $ANDROID_BASE)"
            VALIDATION_PASSED=false
          fi
          
          # Check 3: Contains custom brand
          if echo "$KERNEL_RELEASE" | grep -q "OP-Numbersf"; then
            echo "✅ PASS: Custom brand present (OP-Numbersf)"
          else
            echo "❌ FAIL: Custom brand not found"
            VALIDATION_PASSED=false
          fi
          
          # Check 4: Expected strict format
          if echo "$KERNEL_RELEASE" | grep -qE "^[0-9]+\.[0-9]+\.[0-9]+-android[0-9]+-OP-Numbersf$"; then
            echo "✅ PASS: Perfect format (X.Y.Z-${ANDROID_BASE}-OP-Numbersf)"
          else
            echo "⚠️ INFO: Format differs slightly (may have extra components)"
            echo "   This may be acceptable depending on your requirements"
          fi
          
          # Check 5: No git hash suffix (optional strict check)
          if echo "$KERNEL_RELEASE" | grep -qE '\+g[0-9a-f]{7,}'; then
            echo "⚠️ WARNING: Git hash detected in version string"
            echo "   This suggests LOCALVERSION settings were not fully applied"
          fi
          
          echo ""
          echo "============================================"
          
          if [ "$VALIDATION_PASSED" = true ]; then
            echo "✅ All validations passed"
          else
            echo "❌ Validation failed"
            echo ""
            echo "Expected format: X.Y.Z-${ANDROID_BASE}-OP-Numbersf"
            echo "Actual version:  $KERNEL_RELEASE"
            echo ""
            echo "::group::Debug Information"
            echo "Environment variables:"
            echo "  CUSTOM_LOCALVERSION=${{ env.CUSTOM_LOCALVERSION }}"
            echo "  KANDROID_VERSION=${{ env.KANDROID_VERSION }}"
            echo "  TKERNEL_VERSION=${{ env.TKERNEL_VERSION }}"
            echo ""
            echo "Build configuration:"
            echo "  Fast build: ${{ github.event.inputs.FAST_BUILD }}"
            echo "  Clean build: ${{ github.event.inputs.clean }}"
            echo "::endgroup::"
            echo ""
            echo "::error::Kernel version validation failed"
            exit 1
          fi
          
          echo "============================================"
          
          echo "FINAL_KERNEL_VERSION=$KERNEL_RELEASE" >> "$GITHUB_ENV"
          
          echo "::endgroup::"

      - name: Make AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Numbersf/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          mkdir -p kernel_workspace/kernel_platform/out/Final-Image-Find/
          
          echo "🔍 Searching for kernel Image..."
          image_path=$(find "./kernel_workspace/kernel_platform" -type f -name "Image" \
            -printf '%T@ %p\n' 2>/dev/null | sort -nr | awk 'NR==1{print $2}')
          
          if [ -z "$image_path" ] || [ ! -f "$image_path" ]; then
            echo "⚠️ Primary find failed, trying fallback method..."
            shopt -s nullglob globstar
            candidates=(./kernel_workspace/kernel_platform/**/Image)
            if [ ${#candidates[@]} -gt 0 ]; then
              image_path=$(ls -t "${candidates[@]}" 2>/dev/null | head -n1 || true)
            fi
          fi
          
          if [ -z "$image_path" ] || [ ! -f "$image_path" ]; then
            echo "❌ 未找到 Image 文件，构建失败" >&2
            echo "::group::Debug: Directory structure"
            find ./kernel_workspace/kernel_platform -type f -name "Image" 2>/dev/null || echo "No Image files found"
            echo "::endgroup::"
            exit 1
          fi
          
          echo "✅ Image file located at: $image_path"
          cp "$image_path" ./AnyKernel3/Image
          cp "$image_path" kernel_workspace/kernel_platform/out/Final-Image-Find/Image
          
          dir2=$(dirname "$image_path")/
          
          if [ "${{ env.CPU }}" = "sm8750" ] && [ "${{ github.event.inputs.FAST_BUILD }}" = "false" ]; then
            echo "当前正在使用官方脚本构建 sm8750，需额外复制一些其它镜像文件：dtbo.img、system_dlkm.img。请注意，如果你在刷完官方脚本构建后想换成极速构建，请还原这些分区！"
            echo "You are currently building sm8750 with the official script. Additional image files will be copied: dtbo.img, system_dlkm.img. Please note: If you switch to fast build after flashing this build, make sure to restore these partitions!"
            for file in dtbo.img system_dlkm.erofs.img; do
              if [ -f "$dir2$file" ]; then
                target_name="$file"
                if [ "$file" = "system_dlkm.erofs.img" ]; then
                  target_name="system_dlkm.img"
                fi
                cp "$dir2$file" "./AnyKernel3/$target_name"
              else
                echo "$file 不存在，跳过复制"
              fi
            done
          fi

      - name: Download Latest SUSFS Module from CI
        if: ${{ github.event.inputs.SUSFS_CI == 'CI' }}
        continue-on-error: true
        run: |
          LATEST_RUN_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs?status=success" | \
            jq -r '.workflow_runs[] | select(.head_branch == "v1.5.2+") | .id' | head -n 1)
          if [ -z "$LATEST_RUN_ID" ]; then
            echo "No successful run found for branch v1.5.2+"
          else
            ARTIFACT_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs/$LATEST_RUN_ID/artifacts" | jq -r '.artifacts[0].archive_download_url')
            if [ -n "$ARTIFACT_URL" ]; then
              curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o ksu_module_susfs_1.5.2+_CI.zip "$ARTIFACT_URL"
              cp ksu_module_susfs_1.5.2+_CI.zip ./AnyKernel3/
            else
              echo "Failed to fetch artifact URL"
            fi
          fi

      - name: Download Latest SUSFS Module from Release
        if: ${{ github.event.inputs.SUSFS_CI == 'Release' }}
        continue-on-error: true
        run: |
          wget -O ksu_module_susfs_1.5.2+_Release.zip https://github.com/sidex15/ksu_module_susfs/releases/latest/download/ksu_module_susfs_1.5.2+.zip
          cp ksu_module_susfs_1.5.2+_Release.zip ./AnyKernel3/

      - name: Download Latest SukiSU-Ultra APK from CI
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          
          if ! command -v gh >/dev/null 2>&1; then
            echo "⚠️ gh CLI not available; skipping APK download"
            exit 0
          fi
          
          run_id=$(gh api \
            "repos/SukiSU-Ultra/SukiSU-Ultra/actions/workflows/build-manager.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].id' || echo "")
          if [[ -z "$run_id" ]]; then
            echo "No successful workflow run found. Skipping artifact download."
          else
            artifact_url=$(gh api \
              "repos/SukiSU-Ultra/SukiSU-Ultra/actions/runs/$run_id/artifacts" | \
              jq -r '.artifacts[] | select(.name == "manager") | .archive_download_url' | head -n1)
            if [[ -z "$artifact_url" ]]; then
              echo "No 'manager' artifact found in run $run_id. Skipping download."
            else
              echo "Downloading from: $artifact_url"
              curl -fL -H "Authorization: Bearer $GITHUB_TOKEN" -o manager.zip "$artifact_url"
              unzip -j manager.zip "*.apk" -d ./AnyKernel3/
            fi
          fi

      - name: Set zip Suffix
        id: suffix
        run: |
          echo "value=${{ github.event.inputs.ZRAM == 'true' && '_LZ4KD' || '' }}${{ github.event.inputs.LSM == 'true' && '_LSM' || '' }}${{ github.event.inputs.HOOK == 'kprobe' && '_KP' || github.event.inputs.HOOK == 'manual' && '_VFS' || github.event.inputs.HOOK == 'tracepoint' && '_TP' || '' }}${{ github.event.inputs.SCHED== 'true' && '_SCHED' || '' }}${{ github.event.inputs.optimize_level == 'O3' && '_O3' || '_O2' }}" >> $GITHUB_OUTPUT

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3_SukiSUUltra_${{ env.KSUVER }}_${{ steps.extract_info.outputs.value }}(${{ env.TKERNEL_VERSION }})${{ steps.suffix.outputs.value }}
          path: ./AnyKernel3/*

      - name: Prepare Build Log
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          
          mkdir -p build-logs
          
          LOG_PATHS=(
            "kernel_workspace/kernel_platform/common/build.log"
            "kernel_workspace/kernel_platform/build.log"
            "$(find kernel_workspace -type f -name 'build.log' -printf '%T@ %p\n' 2>/dev/null | sort -rn | awk 'NR==1{print $2}' || echo '')"
          )
          
          LOG_FOUND=false
          for LOG_PATH in "${LOG_PATHS[@]}"; do
            if [ -n "$LOG_PATH" ] && [ -f "$LOG_PATH" ]; then
              cp "$LOG_PATH" build-logs/build.log
              echo "✅ Build log found at: $LOG_PATH"
              LOG_FOUND=true
              break
            fi
          done
          
          if [ "$LOG_FOUND" = false ]; then
            echo "⚠️ No build log found, creating placeholder"
            {
              echo "Build log not generated"
              echo "Possible reasons:"
              echo "  - Build failed before logging started"
              echo "  - FAST_BUILD disabled and standard build doesn't create build.log"
              echo "  - Unexpected error during build initialization"
              echo ""
              echo "Check workflow logs for details"
            } > build-logs/build.log
          fi
          
          {
            echo "═══════════════════════════════════════"
            echo "Build Metadata"
            echo "═══════════════════════════════════════"
            echo "Device: ${{ github.event.inputs.FILE }}"
            echo "Run: #${{ github.run_number }}"
            echo "Workflow: ${{ github.workflow }}"
            echo "Actor: ${{ github.actor }}"
            echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "Build Configuration:"
            echo "  - Kernel: ${{ env.TKERNEL_VERSION }}"
            echo "  - Android: ${{ env.ANDROID_VERSION }}"
            echo "  - Optimization: ${{ github.event.inputs.optimize_level }}"
            echo "  - Fast Build: ${{ github.event.inputs.FAST_BUILD }}"
            echo "  - Clean Build: ${{ github.event.inputs.clean }}"
            echo "  - Hook: ${{ github.event.inputs.HOOK }}"
            echo "  - LSM: ${{ github.event.inputs.LSM }}"
            echo "  - SCHED: ${{ github.event.inputs.SCHED }}"
            echo "  - ZRAM: ${{ github.event.inputs.ZRAM }}"
            echo ""
            echo "Manifest:"
            echo "  - Repo: ${{ env.MANIFEST_REPO }}"
            echo "  - Branch: ${{ env.MANIFEST_BRANCH }}"
            echo ""
            if [ -n "${{ env.BUILD_TIME }}" ]; then
              echo "Build Duration: ${{ env.BUILD_TIME }}s"
            fi
            if [ -n "${{ env.CCACHE_HIT_RATE }}" ]; then
              echo "ccache Hit Rate: ${{ env.CCACHE_HIT_RATE }}%"
            fi
            echo "═══════════════════════════════════════"
          } > build-logs/metadata.txt
      
      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.event.inputs.FILE }}-${{ github.run_number }}
          path: build-logs/
          retention-days: 7    
    
      - name: Download and Unzip ZRAM
        if: ${{ github.event.inputs.ZRAM == 'true' }}
        id: zram_find
        run: |
          set -e
          echo "::group::Download ZRAM module"
          
          echo "🔍 Fetching ZRAM module download link..."
          retries=3
          success=0
          
          for i in $(seq 1 $retries); do
            echo "Attempt $i/$retries..."
            download_url=$(curl -sS --retry 2 --max-time 10 \
              https://api.github.com/repos/FurLC/ZRAM-Module/releases/latest | \
              jq -r '.assets[] | select(.name | test("ZRAM-Module-.*\\.zip")) | .browser_download_url' | head -n1)

            if [ -n "$download_url" ]; then
              echo "✅ Download URL: $download_url"
              if wget -q --show-progress --timeout=30 "$download_url"; then
                success=1
                break
              else
                echo "⚠️ Download failed, retrying..."
              fi
            else
              echo "⚠️ Failed to fetch URL, waiting 3s..."
              sleep 3
            fi
          done

          if [ "$success" -ne 1 ]; then
            echo "❌ Failed to download ZRAM module after $retries attempts"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "::endgroup::"
            exit 0
          fi

          ZIP_FILE=$(ls -t ZRAM-Module-*.zip 2>/dev/null | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ No ZRAM zip file found"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          if ! unzip -tq "$ZIP_FILE" >/dev/null 2>&1; then
            echo "❌ Downloaded ZIP is corrupted"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          unzip -q "$ZIP_FILE" -d ZRAM-Module
          
          echo "🔍 Searching for zram.ko module..."
          zram_path=$(find "./kernel_workspace" -type f -name "zram.ko" \
            -printf '%T@ %p\n' 2>/dev/null | sort -rn | awk 'NR==1{print $2}')
          
          target="./ZRAM-Module/zram/zram.ko"
          
          if [ -n "$zram_path" ] && [ -f "$zram_path" ]; then
            echo "✅ Found zram.ko at: $zram_path"
            mkdir -p "$(dirname "$target")"
            
            if [ "$(realpath "$zram_path" 2>/dev/null || echo "$zram_path")" != \
                 "$(realpath "$target" 2>/dev/null || echo "$target")" ]; then
              cp "$zram_path" "$target"
              chmod 0644 "$target" 2>/dev/null || true
              echo "✅ ZRAM module copied successfully"
              echo "upload=true" >> "$GITHUB_OUTPUT"
            else
              echo "ℹ️ Source and target are the same, skipping copy"
              echo "upload=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "⚠️ zram.ko not found - unsupported kernel version or build failed"
            echo "upload=false" >> "$GITHUB_OUTPUT"
          fi
          
          echo "::endgroup::"

      - name: Upload ZRAM Module
        if: ${{ github.event.inputs.ZRAM == 'true' && steps.zram_find.outputs.upload != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: ZRAM-Module_${{ env.KERNEL_VERSION }}_${{ steps.extract_info.outputs.value }}
          path: ZRAM-Module/*

      - name: Post-build Disk Check
        if: always()
        run: |
          echo "::group::Disk usage"
          df -h
          echo ""
          echo "Workspace size:"
          du -sh kernel_workspace 2>/dev/null || echo "N/A"
          echo "::endgroup::"

      - name: Build Summary
        if: always()
        run: |
          echo "## 🎉 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Device | ${{ github.event.inputs.FILE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Kernel Version | ${{ env.TKERNEL_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android Version | ${{ env.ANDROID_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Optimization | ${{ github.event.inputs.optimize_level }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Fast Build | ${{ github.event.inputs.FAST_BUILD }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Clean Build | ${{ github.event.inputs.clean }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Hook Type | ${{ github.event.inputs.HOOK }} |" >> $GITHUB_STEP_SUMMARY
          echo "| LSM Enabled | ${{ github.event.inputs.LSM }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SCHED Enabled | ${{ github.event.inputs.SCHED }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ZRAM Enabled | ${{ github.event.inputs.ZRAM }} |" >> $GITHUB_STEP_SUMMARY
          echo "| KSU Meta | ${{ github.event.inputs.KSU_META }} |" >> $GITHUB_STEP_SUMMARY
          echo "| KSU Version | ${{ env.KSUVER }} |" >> $GITHUB_STEP_SUMMARY

          if [ -n "${{ env.FINAL_KERNEL_VERSION }}" ]; then
            echo "### 📋 Kernel Version" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "${{ env.FINAL_KERNEL_VERSION }}" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [[ "${{ env.FINAL_KERNEL_VERSION }}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-(android[0-9]+)-OP-Numbersf$ ]]; then
              echo "| Component | Value |" >> $GITHUB_STEP_SUMMARY
              echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
              echo "| Kernel Version | ${BASH_REMATCH[1]} |" >> $GITHUB_STEP_SUMMARY
              echo "| Android Version | ${BASH_REMATCH[2]} |" >> $GITHUB_STEP_SUMMARY
              echo "| Custom Brand | OP-Numbersf |" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          
          if [ -n "${{ env.BUILD_TIME }}" ]; then
            echo "| Build Duration | ${{ env.BUILD_TIME }}s ($((env.BUILD_TIME / 60))m $((env.BUILD_TIME % 60))s) |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "kernel_workspace/kernel_platform/out/Final-Image-Find/Image" ]; then
            IMG_SIZE=$(stat -c%s kernel_workspace/kernel_platform/out/Final-Image-Find/Image)
            echo "| Kernel Image Size | $(numfmt --to=iec-i --suffix=B "$IMG_SIZE") |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ AnyKernel3 package with kernel image" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.ZRAM }}" = "true" ]; then
            if [ "${{ steps.zram_find.outputs.upload }}" != "false" ]; then
              echo "- ✅ ZRAM module" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ⚠️ ZRAM module (not found)" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          if [ "${{ github.event.inputs.SUSFS_CI }}" != "NoN" ]; then
            echo "- ✅ SUSFS module (${{ github.event.inputs.SUSFS_CI }})" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- ✅ SukiSU-Ultra APK" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build log" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔧 Build Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- Kernel branding: \`${{ env.CUSTOM_LOCALVERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Optimization flags: ${{ github.event.inputs.optimize_level }}" >> $GITHUB_STEP_SUMMARY
          echo "- Manifest repo: ${{ env.MANIFEST_REPO }}/${{ env.MANIFEST_BRANCH }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ github.event.inputs.clean }}" != "true" ] && [ "${{ github.event.inputs.FAST_BUILD }}" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📊 ccache Statistics" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            ccache -s 2>/dev/null | head -n 20 >> $GITHUB_STEP_SUMMARY || echo "ccache stats not available" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            
            if [ -n "${{ env.CCACHE_HIT_RATE }}" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Cache Hit Rate:** ${{ env.CCACHE_HIT_RATE }}%" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💾 Disk Usage" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          df -h | grep -E "(Filesystem|/dev/mapper|/mnt|/$)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "kernel_workspace/kernel_platform/out/Final-Image-Find/Image" ]; then
            echo "### ✅ Build Status: **SUCCESS**" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Build Status: **FAILED**" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Workflow run #${{ github.run_number }} • Triggered by @${{ github.actor }}*" >> $GITHUB_STEP_SUMMARY
