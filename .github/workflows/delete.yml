name: 🧹 Cache & Workflow Cleanup

on:
  workflow_dispatch:
    inputs:
      cleanup_type:
        description: 'Cleanup scope'
        required: true
        type: choice
        default: 'analyze_only'
        options:
          - cache_only
          - runs_only
          - full_cleanup
          - analyze_only
      
      device_filter:
        description: 'Device/Kernel filter'
        required: false
        type: choice
        default: 'ALL'
        options:
          - ALL
          - android15-6.6
          - android14-6.1
          - android14-5.15
          - android13-5.15
          - android13-5.10
          - android12-5.10
          - oneplus_13
          - oneplus_13_b
          - oneplus_13_global
          - oneplus_13r
          - oneplus_13s
          - oneplus_13s_b
          - oneplus_13t
          - oneplus_13t_b
          - oneplus_15
          - oneplus_12
          - oneplus_12_v
          - oneplus_12r
          - oneplus_12r_v
          - oneplus_11
          - oneplus_11_v
          - oneplus_11r_v
          - oneplus_10_pro_v
          - oneplus_10t_v
          - oneplus_nord_5
          - oneplus_nord_4_v
          - oneplus_nord_ce4_v
          - oneplus_nord_ce4_lite_5g_v
          - oneplus_ace5
          - oneplus_ace5_pro
          - oneplus_ace5_pro_b
          - oneplus_ace5_ultra
          - oneplus_ace_6
          - oneplus_ace3_v
          - oneplus_ace3_pro_v
          - oneplus_ace_3v_v
          - oneplus_ace2_v
          - oneplus_ace2_pro_v
          - oneplus_ace_pro_v
          - oneplus_open_v
          - oneplus_pad_3
          - oneplus_pad_2_pro
          - oneplus_pad2_v
          - oneplus_pad_pro_v
      
      cache_pattern:
        description: 'Cache cleanup pattern'
        required: false
        type: choice
        default: 'ccache_stale'
        options:
          - all_caches
          - ccache_only
          - ccache_stale
          - ccache_legacy
          - apt_only
          - kernel_only
          - old_only
      
      cache_age_days:
        description: 'Delete caches older than (days)'
        required: false
        type: number
        default: 7
      
      dry_run:
        description: 'Dry run (preview only, no deletions)'
        required: false
        type: boolean
        default: true
      
      force_cleanup:
        description: 'Force cleanup (override protections)'
        required: false
        type: boolean
        default: false

  schedule:
    # Auto cleanup every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'

permissions:
  actions: write
  contents: read

concurrency:
  group: cache-maintenance
  cancel-in-progress: false

jobs:
  analyze:
    name: 📊 Analyze Cache Health
    runs-on: ubuntu-latest
    outputs:
      total_size: ${{ steps.analyze.outputs.total_size }}
      total_count: ${{ steps.analyze.outputs.total_count }}
      health_status: ${{ steps.analyze.outputs.health_status }}
      health_score: ${{ steps.analyze.outputs.health_score }}
      recommendation: ${{ steps.analyze.outputs.recommendation }}
      cache_data: ${{ steps.analyze.outputs.cache_data }}
      
    steps:
      - name: 🔍 Fetch and Analyze Caches
        id: analyze
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const MAX_SIZE_GB = 10;
            const MAX_SIZE_BYTES = MAX_SIZE_GB * 1024 * 1024 * 1024;
            
            // ✅ FIXED: Updated v4 pattern to match actual cache key format
            const CACHE_PATTERNS = {
              v4: /^ccache-suki-v4-([^-]+)-([^-]+)-([^-]+)-([^-]+)$/,
              v3: /^ccache-(?:suki-)?v3-([^-]+)-([0-9.]+)-(?:[A-Za-z0-9.-]+-)?(?:clang-[A-Za-z0-9.-]+-)?([A-Za-z0-9._-]+)(?:-.+)?$/,
              legacy: /^ccache-(?!suki-v[34]-)(.+)$/
            };
            
            const toGB = bytes => bytes / 1024 / 1024 / 1024;
            const fmtGB = (bytes, countHint = 0) => {
              if (bytes === 0 && countHint > 0) return '0.00';
              const g = toGB(bytes);
              return g > 0 && g < 0.01 ? '<0.01' : g.toFixed(2);
            };
            const pct = (part, total) => total > 0 ? ((part / total) * 100).toFixed(1) + '%' : '0.0%';
            
            async function withRetry(fn, maxRetries = 3) {
              for (let attempt = 0; attempt < maxRetries; attempt++) {
                try {
                  return await fn();
                } catch (error) {
                  const isRateLimit = 
                    error.status === 429 || 
                    error.status === 403 ||
                    error.message?.toLowerCase().includes('rate limit');
                  
                  if (isRateLimit && attempt < maxRetries - 1) {
                    const backoff = 1000 * Math.pow(2, attempt) + Math.floor(Math.random() * 500);
                    console.log(`⏳ Rate limit hit, retrying in ${backoff}ms...`);
                    await new Promise(resolve => setTimeout(resolve, backoff));
                    continue;
                  }
                  throw error;
                }
              }
            }
            
            // ✅ NEW: Check API rate limit
            async function checkRateLimit() {
              try {
                const rateLimit = await github.rest.rateLimit.get();
                const remaining = rateLimit.data.rate.remaining;
                const limit = rateLimit.data.rate.limit;
                const resetTime = new Date(rateLimit.data.rate.reset * 1000);
                
                console.log(`📊 GitHub API Rate Limit:`);
                console.log(`  Remaining: ${remaining}/${limit}`);
                console.log(`  Resets at: ${resetTime.toISOString()}`);
                
                if (remaining < 100) {
                  core.warning(`⚠️ Low API rate limit: ${remaining} calls remaining`);
                }
                
                return { remaining, limit, resetTime };
              } catch (error) {
                console.log('⚠️ Could not check rate limit:', error.message);
                return null;
              }
            }
            
            console.log('🔍 Starting cache analysis...\n');
            const rateLimitBefore = await checkRateLimit();
            
            console.log('\nFetching repository caches...');
            const caches = await github.paginate(
              github.rest.actions.getActionsCacheList,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );
            
            console.log(`Found ${caches.length} total caches\n`);
            
            const stats = {
              totalSize: 0,
              totalCount: caches.length,
              cachesByType: {
                ccache: { size: 0, count: 0 },
                apt: { size: 0, count: 0 },
                kernel: { size: 0, count: 0 },
                other: { size: 0, count: 0 }
              },
              cacheKeyVersions: {
                v4: 0,
                v3: 0,
                legacy: 0
              },
              cachesByDevice: new Map(),
              ageDistribution: {
                fresh: 0,
                recent: 0,
                old: 0,
                stale: 0
              },
              activityDistribution: {
                active: 0,
                recent: 0,
                dormant: 0,
                stale: 0
              },
              oldestCache: null,
              newestCache: null
            };
            
            const now = new Date();
            const msPerDay = 24 * 60 * 60 * 1000;
            
            for (const cache of caches) {
              stats.totalSize += cache.size_in_bytes;
              
              const cacheDate = new Date(cache.created_at);
              const lastAccessDate = new Date(cache.last_accessed_at);
              const ageInDays = (now - cacheDate) / msPerDay;
              const daysSinceAccess = (now - lastAccessDate) / msPerDay;
              
              if (!stats.oldestCache || cacheDate < new Date(stats.oldestCache.created_at)) {
                stats.oldestCache = cache;
              }
              if (!stats.newestCache || cacheDate > new Date(stats.newestCache.created_at)) {
                stats.newestCache = cache;
              }
              
              if (ageInDays < 7) stats.ageDistribution.fresh++;
              else if (ageInDays < 14) stats.ageDistribution.recent++;
              else if (ageInDays < 30) stats.ageDistribution.old++;
              else stats.ageDistribution.stale++;
              
              if (daysSinceAccess < 7) stats.activityDistribution.active++;
              else if (daysSinceAccess < 14) stats.activityDistribution.recent++;
              else if (daysSinceAccess < 30) stats.activityDistribution.dormant++;
              else stats.activityDistribution.stale++;
              
              if (cache.key.startsWith('ccache-')) {
                stats.cachesByType.ccache.size += cache.size_in_bytes;
                stats.cachesByType.ccache.count++;
                
                let device = null;
                let osVersion = null;
                let androidVer = null;
                let buildMode = null;
                let isV4 = false;
                let isV3 = false;
                
                // ✅ FIXED: Updated v4 parsing logic
                const v4Match = cache.key.match(CACHE_PATTERNS.v4);
                if (v4Match) {
                  stats.cacheKeyVersions.v4++;
                  isV4 = true;
                  device = v4Match[1];        // oneplus_ace2_pro_v
                  osVersion = v4Match[2];     // O2
                  androidVer = v4Match[3];    // 15.0.0
                  buildMode = v4Match[4];     // fast
                } else {
                  const v3Match = cache.key.match(CACHE_PATTERNS.v3);
                  if (v3Match) {
                    stats.cacheKeyVersions.v3++;
                    isV3 = true;
                    androidVer = v3Match[1];
                    const kernelVer = v3Match[2];
                    device = v3Match[3];
                  } else {
                    const legacyMatch = cache.key.match(CACHE_PATTERNS.legacy);
                    if (legacyMatch) {
                      stats.cacheKeyVersions.legacy++;
                      // Try to extract device from legacy format
                      const parts = cache.key.split('-');
                      if (parts.length >= 5) {
                        device = parts[parts.length - 1];
                      }
                    }
                  }
                }
                
                if (device) {
                  if (!stats.cachesByDevice.has(device)) {
                    stats.cachesByDevice.set(device, {
                      size: 0,
                      count: 0,
                      lastAccessed: lastAccessDate,
                      oldestCache: cacheDate,
                      newestCache: cacheDate,
                      osVersions: new Set(),
                      androidVersions: new Set(),
                      buildModes: new Set(),
                      v4Count: 0,
                      v3Count: 0,
                      legacyCount: 0
                    });
                  }
                  
                  const deviceData = stats.cachesByDevice.get(device);
                  deviceData.size += cache.size_in_bytes;
                  deviceData.count++;
                  
                  if (isV4) deviceData.v4Count++;
                  else if (isV3) deviceData.v3Count++;
                  else deviceData.legacyCount++;
                  
                  if (osVersion) deviceData.osVersions.add(osVersion);
                  if (androidVer) deviceData.androidVersions.add(androidVer);
                  if (buildMode) deviceData.buildModes.add(buildMode);
                  
                  if (lastAccessDate > deviceData.lastAccessed) {
                    deviceData.lastAccessed = lastAccessDate;
                  }
                  if (cacheDate < deviceData.oldestCache) {
                    deviceData.oldestCache = cacheDate;
                  }
                  if (cacheDate > deviceData.newestCache) {
                    deviceData.newestCache = cacheDate;
                  }
                }
              } else if (cache.key.includes('apt-')) {
                stats.cachesByType.apt.size += cache.size_in_bytes;
                stats.cachesByType.apt.count++;
              } else if (cache.key.includes('kernel-source') || cache.key.includes('linux-')) {
                stats.cachesByType.kernel.size += cache.size_in_bytes;
                stats.cachesByType.kernel.count++;
              } else {
                stats.cachesByType.other.size += cache.size_in_bytes;
                stats.cachesByType.other.count++;
              }
            }
            
            const usagePercent = stats.totalSize > 0 ? (stats.totalSize / MAX_SIZE_BYTES) * 100 : 0;
            const usagePercentStr = usagePercent.toFixed(1);
            
            // ✅ NEW: Calculate health score
            function calculateHealthScore() {
              // Size score (0-40 points)
              const sizeScore = Math.max(0, 40 - (usagePercent * 0.4));
              
              // Age score (0-30 points)
              const freshPercent = stats.totalCount > 0 ? (stats.ageDistribution.fresh / stats.totalCount) * 100 : 0;
              const ageScore = (freshPercent / 100) * 30;
              
              // Activity score (0-20 points)
              const activePercent = stats.totalCount > 0 ? (stats.activityDistribution.active / stats.totalCount) * 100 : 0;
              const activityScore = (activePercent / 100) * 20;
              
              // Version score (0-10 points)
              const v4Percent = stats.totalCount > 0 ? (stats.cacheKeyVersions.v4 / stats.totalCount) * 100 : 0;
              const versionScore = (v4Percent / 100) * 10;
              
              const totalScore = sizeScore + ageScore + activityScore + versionScore;
              
              return {
                total: Math.round(totalScore),
                breakdown: {
                  size: Math.round(sizeScore),
                  age: Math.round(ageScore),
                  activity: Math.round(activityScore),
                  version: Math.round(versionScore)
                },
                grade: totalScore >= 90 ? 'A' :
                       totalScore >= 80 ? 'B' :
                       totalScore >= 70 ? 'C' :
                       totalScore >= 60 ? 'D' : 'F'
              };
            }
            
            const healthScore = calculateHealthScore();
            
            let healthStatus = 'Healthy';
            let recommendation = '✅ No action needed';
            
            if (usagePercent > 90) {
              healthStatus = 'Critical';
              recommendation = '🚨 Immediate cleanup required';
            } else if (usagePercent > 75) {
              healthStatus = 'Warning';
              recommendation = '⚠️ Consider cleanup soon';
            } else if (usagePercent > 50) {
              healthStatus = 'Caution';
              recommendation = '💡 Monitor usage';
            }
            
            // ✅ NEW: Generate recommendations
            function generateRecommendations() {
              const recommendations = [];
              
              if (stats.cacheKeyVersions.legacy > 0) {
                const legacyPercent = (stats.cacheKeyVersions.legacy / stats.totalCount) * 100;
                recommendations.push({
                  priority: 'high',
                  emoji: '🔴',
                  action: 'Migrate Legacy Caches',
                  reason: `${stats.cacheKeyVersions.legacy} caches (${legacyPercent.toFixed(1)}%) use old format`,
                  command: 'gh workflow run cache-cleanup.yml -f cleanup_type=cache_only -f cache_pattern=ccache_legacy -f dry_run=false'
                });
              }
              
              const inactiveDevices = Array.from(stats.cachesByDevice.entries())
                .filter(([_, data]) => {
                  const daysSinceAccess = (now - data.lastAccessed) / msPerDay;
                  return daysSinceAccess > 30 && data.size > 100 * 1024 * 1024;
                })
                .sort((a, b) => b[1].size - a[1].size);
              
              if (inactiveDevices.length > 0) {
                const totalInactiveSize = inactiveDevices.reduce((sum, [_, d]) => sum + d.size, 0);
                const savingsGB = fmtGB(totalInactiveSize);
                
                recommendations.push({
                  priority: 'medium',
                  emoji: '🟡',
                  action: 'Clean Inactive Devices',
                  reason: `${inactiveDevices.length} devices unused for 30+ days (${savingsGB} GB potential savings)`,
                  devices: inactiveDevices.slice(0, 5).map(([device, _]) => device).join(', ')
                });
              }
              
              if (stats.ageDistribution.stale > 10) {
                recommendations.push({
                  priority: 'low',
                  emoji: '🟢',
                  action: 'Remove Stale Caches',
                  reason: `${stats.ageDistribution.stale} caches older than 30 days`,
                  command: 'gh workflow run cache-cleanup.yml -f cleanup_type=cache_only -f cache_pattern=old_only -f cache_age_days=30 -f dry_run=false'
                });
              }
              
              if (usagePercent > 80) {
                recommendations.push({
                  priority: 'high',
                  emoji: '🔴',
                  action: 'Urgent Space Cleanup',
                  reason: `Cache usage is ${usagePercentStr}% (>${MAX_SIZE_GB * 0.8} GB)`,
                  command: 'gh workflow run cache-cleanup.yml -f cleanup_type=cache_only -f cache_pattern=ccache_stale -f cache_age_days=7 -f dry_run=false'
                });
              }
              
              return recommendations;
            }
            
            const recommendations = generateRecommendations();
            
            const deviceArray = Array.from(stats.cachesByDevice.entries()).map(([device, data]) => ({
              device,
              size: data.size,
              count: data.count,
              lastAccessed: data.lastAccessed.toISOString(),
              oldestCache: data.oldestCache.toISOString(),
              newestCache: data.newestCache.toISOString(),
              osVersions: Array.from(data.osVersions),
              androidVersions: Array.from(data.androidVersions),
              buildModes: Array.from(data.buildModes),
              v4Count: data.v4Count,
              v3Count: data.v3Count,
              legacyCount: data.legacyCount
            })).sort((a, b) => b.size - a.size);
            
            const totalSizeGB = fmtGB(stats.totalSize, stats.totalCount);
            
            let healthEmoji = '🟢';
            if (usagePercent > 90) healthEmoji = '🔴';
            else if (usagePercent > 75) healthEmoji = '🟡';
            
            // Generate summary report
            const summary = core.summary
              .addHeading(`${healthEmoji} Repository Cache Health Report`, 2)
              .addRaw(`\n**Analysis Date:** ${new Date().toISOString()}\n\n`);
            
            summary.addHeading('📊 Overall Statistics', 3)
              .addTable([
                [{data: 'Metric', header: true}, {data: 'Value', header: true}, {data: 'Status', header: true}],
                ['Total Cache Size', `${totalSizeGB} GB`, `${usagePercentStr}% of ${MAX_SIZE_GB} GB`],
                ['Total Cache Count', stats.totalCount.toString(), healthEmoji],
                ['Health Status', healthStatus, healthEmoji],
                ['Health Score', `${healthScore.total}/100 (Grade ${healthScore.grade})`, healthScore.grade === 'A' ? '🟢' : healthScore.grade === 'B' ? '🟡' : '🔴'],
                ['Recommendation', recommendation, '']
              ]);
            
            // ✅ NEW: Health score breakdown
            summary.addHeading('🎯 Health Score Breakdown', 3)
              .addTable([
                [{data: 'Category', header: true}, {data: 'Score', header: true}, {data: 'Weight', header: true}, {data: 'Status', header: true}],
                ['Size Management', `${healthScore.breakdown.size}/40`, '40%', healthScore.breakdown.size >= 32 ? '✅' : healthScore.breakdown.size >= 24 ? '⚠️' : '❌'],
                ['Cache Freshness', `${healthScore.breakdown.age}/30`, '30%', healthScore.breakdown.age >= 24 ? '✅' : healthScore.breakdown.age >= 18 ? '⚠️' : '❌'],
                ['Activity Level', `${healthScore.breakdown.activity}/20`, '20%', healthScore.breakdown.activity >= 16 ? '✅' : healthScore.breakdown.activity >= 12 ? '⚠️' : '❌'],
                ['Version Compliance', `${healthScore.breakdown.version}/10`, '10%', healthScore.breakdown.version >= 8 ? '✅' : healthScore.breakdown.version >= 6 ? '⚠️' : '❌']
              ]);
            
            summary.addHeading('🗂️ Cache Breakdown by Type', 3)
              .addTable([
                [{data: 'Type', header: true}, {data: 'Count', header: true}, {data: 'Size (GB)', header: true}, {data: 'Percentage', header: true}],
                ['ccache', 
                 stats.cachesByType.ccache.count.toString(),
                 fmtGB(stats.cachesByType.ccache.size, stats.cachesByType.ccache.count),
                 pct(stats.cachesByType.ccache.size, stats.totalSize)],
                ['apt packages',
                 stats.cachesByType.apt.count.toString(),
                 fmtGB(stats.cachesByType.apt.size, stats.cachesByType.apt.count),
                 pct(stats.cachesByType.apt.size, stats.totalSize)],
                ['kernel sources',
                 stats.cachesByType.kernel.count.toString(),
                 fmtGB(stats.cachesByType.kernel.size, stats.cachesByType.kernel.count),
                 pct(stats.cachesByType.kernel.size, stats.totalSize)],
                ['other',
                 stats.cachesByType.other.count.toString(),
                 fmtGB(stats.cachesByType.other.size, stats.cachesByType.other.count),
                 pct(stats.cachesByType.other.size, stats.totalSize)]
              ]);
            
            const totalVersionedCaches = stats.cacheKeyVersions.v4 + stats.cacheKeyVersions.v3 + stats.cacheKeyVersions.legacy;
            summary.addHeading('🔑 Cache Key Versions', 3)
              .addTable([
                [{data: 'Format', header: true}, {data: 'Count', header: true}, {data: 'Percentage', header: true}],
                ['v4 (ccache-suki-v4-*)', 
                 stats.cacheKeyVersions.v4.toString(),
                 totalVersionedCaches > 0 ? pct(stats.cacheKeyVersions.v4, totalVersionedCaches) : '0.0%'],
                ['v3 (ccache[-suki]-v3-*)', 
                 stats.cacheKeyVersions.v3.toString(),
                 totalVersionedCaches > 0 ? pct(stats.cacheKeyVersions.v3, totalVersionedCaches) : '0.0%'],
                ['Legacy (old format)',
                 stats.cacheKeyVersions.legacy.toString(),
                 totalVersionedCaches > 0 ? pct(stats.cacheKeyVersions.legacy, totalVersionedCaches) : '0.0%']
              ]);
            
            if (stats.cacheKeyVersions.v4 === totalVersionedCaches && totalVersionedCaches > 0) {
              summary.addRaw(`\n✅ **All caches using v4 format**\n\n`);
            } else {
              if (stats.cacheKeyVersions.v3 > 0) {
                summary.addRaw(`\n> ℹ️ **v3 Caches Detected**: ${stats.cacheKeyVersions.v3} caches use v3 format. Consider migration to v4.\n\n`);
              }
              if (stats.cacheKeyVersions.legacy > 0) {
                summary.addRaw(`\n> ⚠️ **Legacy Caches Detected**: ${stats.cacheKeyVersions.legacy} caches use old format. Migration to v4 recommended.\n\n`);
              }
            }
            
            summary.addHeading('📅 Cache Age Distribution', 3)
              .addTable([
                [{data: 'Age Range', header: true}, {data: 'Count', header: true}, {data: 'Percentage', header: true}],
                ['< 7 days (Fresh)', stats.ageDistribution.fresh.toString(), pct(stats.ageDistribution.fresh, stats.totalCount)],
                ['7-14 days (Recent)', stats.ageDistribution.recent.toString(), pct(stats.ageDistribution.recent, stats.totalCount)],
                ['14-30 days (Old)', stats.ageDistribution.old.toString(), pct(stats.ageDistribution.old, stats.totalCount)],
                ['> 30 days (Stale)', stats.ageDistribution.stale.toString(), pct(stats.ageDistribution.stale, stats.totalCount)]
              ]);
            
            summary.addHeading('🔄 Activity Distribution', 3)
              .addTable([
                [{data: 'Activity Level', header: true}, {data: 'Count', header: true}, {data: 'Percentage', header: true}],
                ['< 7 days (Active)', stats.activityDistribution.active.toString(), pct(stats.activityDistribution.active, stats.totalCount)],
                ['7-14 days (Recent)', stats.activityDistribution.recent.toString(), pct(stats.activityDistribution.recent, stats.totalCount)],
                ['14-30 days (Dormant)', stats.activityDistribution.dormant.toString(), pct(stats.activityDistribution.dormant, stats.totalCount)],
                ['> 30 days (Stale)', stats.activityDistribution.stale.toString(), pct(stats.activityDistribution.stale, stats.totalCount)]
              ]);
            
            if (deviceArray.length > 0) {
              const inactiveDevices = deviceArray.filter(d => {
                const daysSinceAccess = (now - new Date(d.lastAccessed)) / msPerDay;
                return daysSinceAccess > 30;
              });
              
              summary.addHeading('📱 Top 15 Devices by Cache Size', 3)
                .addTable([
                  [{data: 'Device', header: true}, {data: 'Count', header: true}, {data: 'Size (GB)', header: true}, 
                   {data: 'v4/v3/Legacy', header: true}, {data: 'Last Access', header: true}, {data: 'OS Versions', header: true}],
                  ...deviceArray.slice(0, 15).map(d => [
                    d.device,
                    d.count.toString(),
                    fmtGB(d.size, d.count),
                    `${d.v4Count}/${d.v3Count}/${d.legacyCount}`,
                    `${Math.floor((now - new Date(d.lastAccessed)) / msPerDay)}d ago`,
                    d.osVersions.join(', ') || 'N/A'
                  ])
                ]);
              
              if (inactiveDevices.length > 0) {
                summary.addHeading('⚠️ Inactive Devices (>30 days)', 3)
                  .addTable([
                    [{data: 'Device', header: true}, {data: 'Count', header: true}, {data: 'Size (GB)', header: true}, 
                     {data: 'Last Access', header: true}, {data: 'Potential Savings', header: true}],
                    ...inactiveDevices.slice(0, 10).map(d => [
                      d.device,
                      d.count.toString(),
                      fmtGB(d.size, d.count),
                      `${Math.floor((now - new Date(d.lastAccessed)) / msPerDay)}d ago`,
                      pct(d.size, stats.totalSize)
                    ])
                  ]);
                
                const potentialSavings = inactiveDevices.reduce((sum, d) => sum + d.size, 0);
                const savingsGB = fmtGB(potentialSavings);
                summary.addRaw(`\n> 💡 **Potential Savings**: ${savingsGB} GB (${pct(potentialSavings, stats.totalSize)})\n\n`);
              }
            }
            
            // ✅ NEW: Recommendations section
            if (recommendations.length > 0) {
              summary.addHeading('💡 Recommended Actions', 3);
              
              for (const rec of recommendations) {
                summary.addRaw(`\n${rec.emoji} **${rec.action}** (${rec.priority} priority)\n`);
                summary.addRaw(`   ${rec.reason}\n`);
                
                if (rec.command) {
                  summary.addRaw(`   \`\`\`bash\n   ${rec.command}\n   \`\`\`\n`);
                }
                
                if (rec.devices) {
                  summary.addRaw(`   Affected devices: ${rec.devices}\n`);
                }
              }
            } else {
              summary.addHeading('💡 Recommendations', 3);
              summary.addRaw(`\n✅ **Excellent!** No immediate actions required.\n\n`);
            }
            
            const rateLimitAfter = await checkRateLimit();
            if (rateLimitBefore && rateLimitAfter) {
              const apiCallsUsed = rateLimitBefore.remaining - rateLimitAfter.remaining;
              summary.addRaw(`\n---\n\n📊 **API Calls Used**: ${apiCallsUsed}\n`);
            }
            
            await summary.write();
            
            core.setOutput('total_size', totalSizeGB);
            core.setOutput('total_count', stats.totalCount);
            core.setOutput('health_status', healthStatus);
            core.setOutput('health_score', healthScore.total);
            core.setOutput('recommendation', recommendation);
            core.setOutput('cache_data', JSON.stringify({
              totalSize: stats.totalSize,
              totalCount: stats.totalCount,
              usagePercent: usagePercentStr,
              maxSizeGB: MAX_SIZE_GB,
              healthScore: healthScore,
              cachesByType: stats.cachesByType,
              cacheKeyVersions: stats.cacheKeyVersions,
              cachesByDevice: deviceArray,
              ageDistribution: stats.ageDistribution,
              activityDistribution: stats.activityDistribution,
              recommendations: recommendations,
              oldestCache: stats.oldestCache,
              newestCache: stats.newestCache,
              healthStatus,
              recommendation
            }));

  cleanup-caches:
    name: 🧹 Cleanup Caches
    runs-on: ubuntu-latest
    needs: analyze
    outputs:
      deleted_count: ${{ steps.cleanup.outputs.deleted_count }}
      freed_space: ${{ steps.cleanup.outputs.freed_space }}
    if: |
      (github.event_name == 'workflow_dispatch' && 
       (inputs.cleanup_type == 'cache_only' || inputs.cleanup_type == 'full_cleanup')) ||
      github.event_name == 'schedule'
    
    steps:
      - name: 🗑️ Delete Matching Caches
        id: cleanup
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const isScheduled = context.eventName === 'schedule';
            const dryRun = isScheduled ? false : ('${{ inputs.dry_run }}' === 'true');
            const deviceFilter = isScheduled ? 'ALL' : '${{ inputs.device_filter }}';
            const cachePattern = isScheduled ? 'ccache_stale' : '${{ inputs.cache_pattern }}';
            const cacheAgeDays = isScheduled ? 14 : parseInt('${{ inputs.cache_age_days }}');
            const forceCleanup = isScheduled ? false : ('${{ inputs.force_cleanup }}' === 'true');
            
            // ✅ FIXED: Updated v4 pattern
            const V4_PATTERN = /^ccache-suki-v4-([^-]+)-([^-]+)-([^-]+)-([^-]+)$/;
            const V3_PATTERN = /^ccache-(?:suki-)?v3-([^-]+)-([0-9.]+)-(?:[A-Za-z0-9.-]+-)?(?:clang-[A-Za-z0-9.-]+-)?([A-Za-z0-9._-]+)(?:-.+)?$/;
            const LEGACY_PATTERN = /^ccache-(?!suki-v[34]-)(.+)$/;
            
            const toGB = bytes => bytes / 1024 / 1024 / 1024;
            const fmtGB = (bytes, countHint = 0) => {
              if (bytes === 0 && countHint > 0) return '0.00';
              const g = toGB(bytes);
              return g > 0 && g < 0.01 ? '<0.01' : g.toFixed(2);
            };
            const pct = (part, total) => total > 0 ? ((part / total) * 100).toFixed(1) + '%' : '0.0%';
            
            async function withRetry(fn, maxRetries = 3) {
              for (let attempt = 0; attempt < maxRetries; attempt++) {
                try {
                  return await fn();
                } catch (error) {
                  const isRateLimit = 
                    error.status === 429 || 
                    error.status === 403 ||
                    error.message?.toLowerCase().includes('rate limit');
                  
                  if (isRateLimit && attempt < maxRetries - 1) {
                    const backoff = 1000 * Math.pow(2, attempt) + Math.floor(Math.random() * 500);
                    console.log(`⏳ Rate limit hit, retrying in ${backoff}ms...`);
                    await new Promise(resolve => setTimeout(resolve, backoff));
                    continue;
                  }
                  throw error;
                }
              }
            }
            
            // ✅ NEW: Enhanced device matching
            function matchesDeviceFilter(cacheKey, device, kernel, filter) {
              if (filter === 'ALL') return true;
              
              const normalizedFilter = filter.toLowerCase().replace(/_/g, '-');
              const normalizedDevice = device?.toLowerCase().replace(/_/g, '-');
              const normalizedKernel = kernel?.toLowerCase();
              
              if (normalizedDevice === normalizedFilter) return true;
              if (normalizedKernel === filter.toLowerCase()) return true;
              if (normalizedKernel?.includes(normalizedFilter)) return true;
              
              const normalizedKey = cacheKey.toLowerCase().replace(/_/g, '-');
              return normalizedKey.includes(normalizedFilter);
            }
            
            console.log('🧹 Starting cache cleanup...\n');
            console.log(`Configuration:`);
            console.log(`  Device Filter: ${deviceFilter}`);
            console.log(`  Cache Pattern: ${cachePattern}`);
            console.log(`  Age Threshold: ${cacheAgeDays} days`);
            console.log(`  Dry Run: ${dryRun}`);
            console.log(`  Force: ${forceCleanup}`);
            console.log(`  Scheduled: ${isScheduled}\n`);
            
            const staleCutoffDate = new Date(Date.now() - cacheAgeDays * 24 * 60 * 60 * 1000);
            const veryRecentCutoffDate = new Date(Date.now() - 2 * 60 * 60 * 1000);
            
            let totalDeleted = 0;
            let totalFreed = 0;
            const deletedCaches = [];
            const failedDeletions = [];
            
            const deletionStats = {
              ccache: { count: 0, size: 0, v4: 0, v3: 0, legacy: 0 },
              apt: { count: 0, size: 0 },
              kernel: { count: 0, size: 0 },
              other: { count: 0, size: 0 }
            };
            
            function shouldDeleteCache(cache) {
              const cacheKey = cache.key;
              const cacheDate = new Date(cache.created_at);
              const lastAccessDate = new Date(cache.last_accessed_at || cache.created_at);
              const accessAgeDays = Math.floor((new Date() - lastAccessDate) / (1000 * 60 * 60 * 24));
              
              const isV4Format = cacheKey.startsWith('ccache-suki-v4-');
              const isV3Format = cacheKey.startsWith('ccache-v3-') || cacheKey.startsWith('ccache-suki-v3-');
              const isLegacyFormat = cacheKey.startsWith('ccache-') && !isV4Format && !isV3Format;
              
              if (lastAccessDate > veryRecentCutoffDate && !forceCleanup) {
                return { delete: false, reason: 'recently_used' };
              }
              
              let device = null;
              let kernel = null;
              
              if (isV4Format) {
                const v4Match = cacheKey.match(V4_PATTERN);
                if (v4Match) {
                  device = v4Match[1];
                  kernel = v4Match[3]; // Android version can act as kernel identifier
                }
              } else if (isV3Format) {
                const v3Match = cacheKey.match(V3_PATTERN);
                if (v3Match) {
                  kernel = v3Match[2];
                  device = v3Match[3];
                }
              } else if (isLegacyFormat) {
                const legacyMatch = cacheKey.match(LEGACY_PATTERN);
                if (legacyMatch) {
                  const parts = cacheKey.split('-');
                  device = parts[parts.length - 1];
                }
              }
              
              const deviceMatchesFilter = matchesDeviceFilter(cacheKey, device, kernel, deviceFilter);
              
              if (!deviceMatchesFilter) {
                return { delete: false, reason: 'device_filter' };
              }
              
              let patternMatch = false;
              let category = 'other';
              
              switch (cachePattern) {
                case 'all_caches':
                  patternMatch = true;
                  category = cacheKey.startsWith('ccache-') ? 'ccache' :
                            cacheKey.startsWith('apt-') ? 'apt' :
                            (cacheKey.includes('kernel') || cacheKey.includes('linux-')) ? 'kernel' : 'other';
                  break;
                
                case 'ccache_only':
                  if (cacheKey.startsWith('ccache-')) {
                    patternMatch = true;
                    category = 'ccache';
                  }
                  break;
                
                case 'ccache_stale':
                  if (cacheKey.startsWith('ccache-') && lastAccessDate < staleCutoffDate) {
                    patternMatch = true;
                    category = 'ccache';
                  }
                  break;
                
                // ✅ NEW: Target only legacy caches
                case 'ccache_legacy':
                  if (isLegacyFormat) {
                    patternMatch = true;
                    category = 'ccache';
                  }
                  break;
                
                case 'apt_only':
                  if (cacheKey.startsWith('apt-')) {
                    patternMatch = true;
                    category = 'apt';
                  }
                  break;
                
                case 'kernel_only':
                  if (cacheKey.includes('kernel') || cacheKey.includes('linux-')) {
                    patternMatch = true;
                    category = 'kernel';
                  }
                  break;
                
                case 'old_only':
                  if (cacheDate < staleCutoffDate) {
                    patternMatch = true;
                    category = cacheKey.startsWith('ccache-') ? 'ccache' :
                              cacheKey.startsWith('apt-') ? 'apt' :
                              (cacheKey.includes('kernel') || cacheKey.includes('linux-')) ? 'kernel' : 'other';
                  }
                  break;
              }
              
              return { 
                delete: patternMatch, 
                reason: patternMatch ? 'match' : 'pattern_mismatch',
                category: category,
                device: device,
                isV4: isV4Format,
                isV3: isV3Format,
                isLegacy: isLegacyFormat,
                accessAgeDays: accessAgeDays
              };
            }
            
            console.log('🔍 Scanning caches...\n');
            
            const caches = await github.paginate(
              github.rest.actions.getActionsCacheList,
              {
                owner,
                repo,
                per_page: 100
              }
            );
            
            console.log(`Found ${caches.length} caches to evaluate\n`);
            
            // ✅ NEW: Batch deletion with progress
            const cachesToDelete = [];
            
            for (const cache of caches) {
              const decision = shouldDeleteCache(cache);
              
              if (decision.delete) {
                const sizeMB = (cache.size_in_bytes / 1024 / 1024).toFixed(2);
                const agedays = Math.floor((new Date() - new Date(cache.created_at)) / (1000 * 60 * 60 * 24));
                
                cachesToDelete.push({
                  key: cache.key,
                  size: sizeMB,
                  sizeBytes: cache.size_in_bytes,
                  age: agedays,
                  created: cache.created_at,
                  accessed: cache.last_accessed_at || cache.created_at,
                  id: cache.id,
                  category: decision.category,
                  device: decision.device,
                  accessAgeDays: decision.accessAgeDays,
                  isV4: decision.isV4,
                  isV3: decision.isV3,
                  isLegacy: decision.isLegacy
                });
              }
            }
            
            console.log(`Selected ${cachesToDelete.length} caches for ${dryRun ? 'preview' : 'deletion'}\n`);
            
            if (dryRun) {
              for (const cache of cachesToDelete) {
                console.log(`🔍 Would delete: ${cache.key}`);
                console.log(`   Size: ${cache.size} MB | Age: ${cache.age}d | Access: ${cache.accessAgeDays}d ago`);
                
                deletedCaches.push(cache);
                totalFreed += cache.sizeBytes;
                
                deletionStats[cache.category].count++;
                deletionStats[cache.category].size += cache.sizeBytes;
                
                if (cache.category === 'ccache') {
                  if (cache.isV4) deletionStats.ccache.v4++;
                  else if (cache.isV3) deletionStats.ccache.v3++;
                  else if (cache.isLegacy) deletionStats.ccache.legacy++;
                }
              }
              totalDeleted = cachesToDelete.length;
            } else {
              // Process in batches of 10
              const batchSize = 10;
              for (let i = 0; i < cachesToDelete.length; i += batchSize) {
                const batch = cachesToDelete.slice(i, i + batchSize);
                
                await Promise.all(
                  batch.map(async cache => {
                    try {
                      console.log(`🗑️ Deleting [${i + batch.indexOf(cache) + 1}/${cachesToDelete.length}]: ${cache.key}`);
                      
                      await withRetry(() =>
                        github.rest.actions.deleteActionsCacheById({
                          owner,
                          repo,
                          cache_id: cache.id
                        })
                      );
                      
                      totalDeleted++;
                      totalFreed += cache.sizeBytes;
                      deletedCaches.push(cache);
                      
                      deletionStats[cache.category].count++;
                      deletionStats[cache.category].size += cache.sizeBytes;
                      
                      if (cache.category === 'ccache') {
                        if (cache.isV4) deletionStats.ccache.v4++;
                        else if (cache.isV3) deletionStats.ccache.v3++;
                        else if (cache.isLegacy) deletionStats.ccache.legacy++;
                      }
                    } catch (error) {
                      console.log(`   ⚠️ Failed: ${error.message}`);
                      failedDeletions.push({
                        key: cache.key,
                        error: error.message
                      });
                    }
                  })
                );
                
                // Small delay between batches
                if (i + batchSize < cachesToDelete.length) {
                  await new Promise(resolve => setTimeout(resolve, 500));
                }
                
                const progress = ((i + batch.length) / cachesToDelete.length * 100).toFixed(1);
                console.log(`Progress: ${i + batch.length}/${cachesToDelete.length} (${progress}%)\n`);
              }
            }
            
            const freedGB = fmtGB(totalFreed, totalDeleted);
            
            console.log(`\n✅ Cleanup ${dryRun ? 'simulation' : 'complete'}:`);
            console.log(`   ${dryRun ? 'Would delete' : 'Deleted'}: ${totalDeleted} caches`);
            console.log(`   ${dryRun ? 'Would free' : 'Freed'}: ${freedGB} GB`);
            if (failedDeletions.length > 0) {
              console.log(`   ⚠️ Failed: ${failedDeletions.length} caches\n`);
            }
            
            const summary = core.summary
              .addHeading(`🧹 Cache Cleanup ${dryRun ? 'Preview' : 'Report'}`, 2)
              .addRaw(`\n**Cleanup Date:** ${new Date().toISOString()}\n\n`);
            
            if (dryRun) {
              summary.addRaw(`> ⚠️ **DRY RUN MODE** - No caches were deleted.\n\n`);
            }
            
            if (isScheduled) {
              summary.addRaw(`> 🤖 **Scheduled Cleanup** - Automated weekly maintenance\n\n`);
            }
            
            summary.addHeading('📊 Cleanup Summary', 3)
              .addTable([
                [{data: 'Metric', header: true}, {data: 'Value', header: true}],
                ['Caches ' + (dryRun ? 'to Delete' : 'Deleted'), totalDeleted.toString()],
                ['Space ' + (dryRun ? 'to Free' : 'Freed'), `${freedGB} GB`],
                ['Failed Deletions', failedDeletions.length.toString()],
                ['Device Filter', deviceFilter],
                ['Cache Pattern', cachePattern],
                ['Age Threshold', `${cacheAgeDays} days`]
              ]);
            
            summary.addHeading('🗂️ Deletion Breakdown', 3)
              .addTable([
                [{data: 'Type', header: true}, {data: 'Count', header: true}, {data: 'Size (GB)', header: true}, {data: 'Percentage', header: true}],
                ['ccache', 
                 deletionStats.ccache.count.toString(),
                 fmtGB(deletionStats.ccache.size, deletionStats.ccache.count),
                 pct(deletionStats.ccache.size, totalFreed)],
                ['  └─ v4', 
                 deletionStats.ccache.v4.toString(),
                 '',
                 ''],
                ['  └─ v3', 
                 deletionStats.ccache.v3.toString(),
                 '',
                 ''],
                ['  └─ legacy', 
                 deletionStats.ccache.legacy.toString(),
                 '',
                 ''],
                ['apt packages',
                 deletionStats.apt.count.toString(),
                 fmtGB(deletionStats.apt.size, deletionStats.apt.count),
                 pct(deletionStats.apt.size, totalFreed)],
                ['kernel sources',
                 deletionStats.kernel.count.toString(),
                 fmtGB(deletionStats.kernel.size, deletionStats.kernel.count),
                 pct(deletionStats.kernel.size, totalFreed)],
                ['other',
                 deletionStats.other.count.toString(),
                 fmtGB(deletionStats.other.size, deletionStats.other.count),
                 pct(deletionStats.other.size, totalFreed)]
              ]);
            
            if (deletedCaches.length > 0) {
              const largestDeleted = deletedCaches
                .sort((a, b) => b.sizeBytes - a.sizeBytes)
                .slice(0, 20);
              
              summary.addHeading('📦 Top 20 Largest Caches ' + (dryRun ? 'to Delete' : 'Deleted'), 3)
                .addTable([
                  [{data: 'Cache Key', header: true}, {data: 'Size (MB)', header: true}, 
                   {data: 'Version', header: true}, {data: 'Last Access', header: true}],
                  ...largestDeleted.map(cache => [
                    cache.key.length > 60 ? cache.key.substring(0, 57) + '...' : cache.key,
                    cache.size,
                    cache.isV4 ? 'v4' : cache.isV3 ? 'v3' : 'legacy',
                    `${cache.accessAgeDays}d ago`
                  ])
                ]);
            }
            
            if (failedDeletions.length > 0) {
              summary.addHeading('❌ Failed Deletions', 3)
                .addTable([
                  [{data: 'Cache Key', header: true}, {data: 'Error', header: true}],
                  ...failedDeletions.map(f => [f.key, f.error])
                ]);
            }
            
            await summary.write();
            
            core.setOutput('deleted_count', totalDeleted);
            core.setOutput('freed_space', freedGB);

  cleanup-runs:
    name: 🗑️ Cleanup Workflow Runs
    runs-on: ubuntu-latest
    needs: analyze
    if: |
      (github.event_name == 'workflow_dispatch' && 
       (inputs.cleanup_type == 'runs_only' || inputs.cleanup_type == 'full_cleanup')) ||
      github.event_name == 'schedule'
    
    steps:
      - name: 🧹 Delete Old Runs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const isScheduled = context.eventName === 'schedule';
            const dryRun = isScheduled ? false : ('${{ inputs.dry_run }}' === 'true');
            const keepDays = 30;
            const keepRecent = 5;
            
            const pct = (part, total) => total > 0 ? ((part / total) * 100).toFixed(1) + '%' : '0.0%';
            
            async function withRetry(fn, maxRetries = 3) {
              for (let attempt = 0; attempt < maxRetries; attempt++) {
                try {
                  return await fn();
                } catch (error) {
                  const isRateLimit = 
                    error.status === 429 || 
                    error.status === 403 ||
                    error.message?.toLowerCase().includes('rate limit');
                  
                  if (isRateLimit && attempt < maxRetries - 1) {
                    const backoff = 1000 * Math.pow(2, attempt) + Math.floor(Math.random() * 500);
                    console.log(`⏳ Rate limit hit, retrying in ${backoff}ms...`);
                    await new Promise(resolve => setTimeout(resolve, backoff));
                    continue;
                  }
                  throw error;
                }
              }
            }
            
            console.log('🗑️ Starting workflow runs cleanup...\n');
            console.log(`Configuration:`);
            console.log(`  Keep Days: ${keepDays}`);
            console.log(`  Keep Recent: ${keepRecent}`);
            console.log(`  Dry Run: ${dryRun}\n`);
            
            const cutoffDate = new Date(Date.now() - keepDays * 24 * 60 * 60 * 1000);
            
            let totalDeleted = 0;
            const deletionsByWorkflow = new Map();
            const deletionsByStatus = {
              failed: 0,
              cancelled: 0,
              skipped: 0,
              success: 0
            };
            
            const workflows = await withRetry(() =>
              github.rest.actions.listRepoWorkflows({
                owner,
                repo
              })
            );
            
            for (const workflow of workflows.data.workflows) {
              console.log(`\n📋 Processing: ${workflow.name}`);
              
              const successfulRuns = [];
              
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                {
                  owner,
                  repo,
                  workflow_id: workflow.id,
                  per_page: 100
                }
              );
              
              for (const run of runs) {
                const runDate = new Date(run.created_at);
                const isOld = runDate < cutoffDate;
                
                if (run.conclusion === 'success') {
                  successfulRuns.push(run);
                }
                
                const shouldDelete = 
                  (run.conclusion === 'failure' && isOld) ||
                  (run.conclusion === 'cancelled' && isOld) ||
                  (run.conclusion === 'skipped' && isOld) ||
                  (run.conclusion === 'success' && isOld && successfulRuns.length > keepRecent);
                
                if (shouldDelete) {
                  if (dryRun) {
                    console.log(`[DRY RUN] Would delete: Run #${run.run_number} (${run.conclusion})`);
                  } else {
                    console.log(`Deleting: Run #${run.run_number} (${run.conclusion})`);
                    
                    try {
                      await withRetry(() =>
                        github.rest.actions.deleteWorkflowRun({
                          owner,
                          repo,
                          run_id: run.id
                        })
                      );
                    } catch (error) {
                      console.error(`❌ Failed: ${error.message}`);
                      continue;
                    }
                  }
                  
                  totalDeleted++;
                  
                  if (!deletionsByWorkflow.has(workflow.name)) {
                    deletionsByWorkflow.set(workflow.name, 0);
                  }
                  deletionsByWorkflow.set(workflow.name, deletionsByWorkflow.get(workflow.name) + 1);
                  
                  if (run.conclusion === 'failure') deletionsByStatus.failed++;
                  else if (run.conclusion === 'cancelled') deletionsByStatus.cancelled++;
                  else if (run.conclusion === 'skipped') deletionsByStatus.skipped++;
                  else if (run.conclusion === 'success') deletionsByStatus.success++;
                }
              }
            }
            
            console.log(`\n✅ Runs cleanup ${dryRun ? 'simulation' : 'complete'}: ${totalDeleted} runs\n`);
            
            const summary = core.summary
              .addHeading(`🗑️ Workflow Runs Cleanup ${dryRun ? 'Preview' : 'Report'}`, 2)
              .addRaw(`\n**Cleanup Date:** ${new Date().toISOString()}\n\n`);
            
            if (dryRun) {
              summary.addRaw(`> ⚠️ **DRY RUN MODE**\n\n`);
            }
            
            if (isScheduled) {
              summary.addRaw(`> 🤖 **Scheduled Cleanup**\n\n`);
            }
            
            summary.addHeading('📊 Summary', 3)
              .addTable([
                [{data: 'Metric', header: true}, {data: 'Value', header: true}],
                ['Runs ' + (dryRun ? 'to Delete' : 'Deleted'), totalDeleted.toString()],
                ['Keep Days', `${keepDays} days`],
                ['Keep Recent', `${keepRecent} per workflow`]
              ]);
            
            summary.addHeading('📈 By Status', 3)
              .addTable([
                [{data: 'Status', header: true}, {data: 'Count', header: true}, {data: 'Percentage', header: true}],
                ['Failed', deletionsByStatus.failed.toString(), pct(deletionsByStatus.failed, totalDeleted)],
                ['Cancelled', deletionsByStatus.cancelled.toString(), pct(deletionsByStatus.cancelled, totalDeleted)],
                ['Skipped', deletionsByStatus.skipped.toString(), pct(deletionsByStatus.skipped, totalDeleted)],
                ['Success (old)', deletionsByStatus.success.toString(), pct(deletionsByStatus.success, totalDeleted)]
              ]);
            
            if (deletionsByWorkflow.size > 0) {
              const topWorkflows = Array.from(deletionsByWorkflow.entries())
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10);
              
              summary.addHeading('📋 Top 10 
                            summary.addHeading('📋 Top 10 Workflows', 3)
                .addTable([
                  [{data: 'Workflow', header: true}, {data: 'Runs Deleted', header: true}],
                  ...topWorkflows.map(([name, count]) => [name, count.toString()])
                ]);
            }
            
            await summary.write();

  final-report:
    name: 📊 Final Report
    runs-on: ubuntu-latest
    needs: [analyze, cleanup-caches, cleanup-runs]
    if: always() && needs.analyze.result == 'success'
    
    steps:
      - name: 📈 Generate Summary
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const isScheduled = context.eventName === 'schedule';
            const dryRun = isScheduled ? false : ('${{ inputs.dry_run }}' === 'true');
            
            const beforeSize = parseFloat('${{ needs.analyze.outputs.total_size }}') || 0;
            const beforeCount = parseInt('${{ needs.analyze.outputs.total_count }}') || 0;
            const beforeHealthScore = parseInt('${{ needs.analyze.outputs.health_score }}') || 0;
            
            const caches = await github.paginate(
              github.rest.actions.getActionsCacheList,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );
            
            let totalCacheSize = 0;
            for (const cache of caches) {
              totalCacheSize += cache.size_in_bytes;
            }
            
            const afterSizeGB = (totalCacheSize / 1024 / 1024 / 1024).toFixed(2);
            const afterCount = caches.length;
            const maxCacheSize = 10 * 1024 * 1024 * 1024;
            const afterPercent = ((totalCacheSize / maxCacheSize) * 100).toFixed(1);
            
            const freedSpace = (beforeSize - parseFloat(afterSizeGB)).toFixed(2);
            const freedCaches = beforeCount - afterCount;
            const beforeUsage = ((beforeSize / 10) * 100).toFixed(1);
            
            let healthEmoji = '🟢';
            let healthStatus = 'Healthy';
            if (parseFloat(afterPercent) > 90) {
              healthEmoji = '🔴';
              healthStatus = 'Critical';
            } else if (parseFloat(afterPercent) > 75) {
              healthEmoji = '🟡';
              healthStatus = 'Warning';
            }
            
            const summary = core.summary
              .addHeading(`${healthEmoji} Final Cleanup Report`, 2)
              .addRaw(`\n**Report Date:** ${new Date().toISOString()}\n\n`);
            
            if (dryRun) {
              summary.addRaw(`> ⚠️ **DRY RUN MODE** - This is a preview only.\n\n`);
            }
            
            if (isScheduled) {
              summary.addRaw(`> 🤖 **Scheduled Cleanup** - Automated weekly maintenance\n\n`);
            }
            
            summary.addHeading('📊 Before vs After', 3)
              .addTable([
                [{data: 'Metric', header: true}, {data: 'Before', header: true}, {data: 'After', header: true}, {data: 'Change', header: true}],
                ['Cache Size', 
                 `${beforeSize.toFixed(2)} GB`, 
                 `${afterSizeGB} GB`, 
                 `${freedSpace} GB ${dryRun ? '(would free)' : '(freed)'}`],
                ['Cache Count', 
                 beforeCount.toString(), 
                 afterCount.toString(), 
                 `${freedCaches} ${dryRun ? '(would delete)' : '(deleted)'}`],
                ['Usage %', 
                 `${beforeUsage}%`, 
                 `${afterPercent}%`, 
                 `${(parseFloat(beforeUsage) - parseFloat(afterPercent)).toFixed(1)}% reduction`],
                ['Health Score',
                 `${beforeHealthScore}/100`,
                 dryRun ? 'N/A' : 'Recalculate needed',
                 dryRun ? 'N/A' : ''],
                ['Health Status', 
                 '', 
                 healthStatus, 
                 healthEmoji]
              ]);
            
            // ✅ NEW: Cleanup job results
            const cacheCleanupResult = '${{ needs.cleanup-caches.result }}';
            const runsCleanupResult = '${{ needs.cleanup-runs.result }}';
            
            if (cacheCleanupResult !== 'skipped') {
              summary.addHeading('🧹 Cache Cleanup Results', 3);
              
              if (cacheCleanupResult === 'success') {
                const deletedCount = '${{ needs.cleanup-caches.outputs.deleted_count }}' || '0';
                const freedSpace = '${{ needs.cleanup-caches.outputs.freed_space }}' || '0.00';
                
                summary.addRaw(`\n✅ **Success**\n`);
                summary.addRaw(`- Caches ${dryRun ? 'to delete' : 'deleted'}: ${deletedCount}\n`);
                summary.addRaw(`- Space ${dryRun ? 'to free' : 'freed'}: ${freedSpace} GB\n\n`);
              } else if (cacheCleanupResult === 'failure') {
                summary.addRaw(`\n❌ **Failed** - Check job logs for details\n\n`);
              }
            }
            
            if (runsCleanupResult !== 'skipped') {
              summary.addHeading('🗑️ Workflow Runs Cleanup Results', 3);
              
              if (runsCleanupResult === 'success') {
                summary.addRaw(`\n✅ **Success** - Old workflow runs cleaned up\n\n`);
              } else if (runsCleanupResult === 'failure') {
                summary.addRaw(`\n❌ **Failed** - Check job logs for details\n\n`);
              }
            }
            
            summary.addHeading('💡 Recommendations', 3);
            
            if (parseFloat(afterPercent) > 90) {
              summary.addRaw(`\n🔴 **Critical**: Cache usage is still very high (${afterPercent}%).\n\n`);
              summary.addRaw(`**Immediate Actions:**\n`);
              summary.addRaw(`1. Run aggressive cleanup: \`gh workflow run cache-cleanup.yml -f cleanup_type=cache_only -f cache_pattern=ccache_stale -f cache_age_days=3 -f dry_run=false\`\n`);
              summary.addRaw(`2. Consider removing inactive device caches\n`);
              summary.addRaw(`3. Review build configurations to reduce cache size\n\n`);
            } else if (parseFloat(afterPercent) > 75) {
              summary.addRaw(`\n🟡 **Warning**: Cache usage is elevated (${afterPercent}%).\n\n`);
              summary.addRaw(`**Recommended Actions:**\n`);
              summary.addRaw(`1. Monitor cache growth over next few days\n`);
              summary.addRaw(`2. Consider cleanup if usage exceeds 85%\n`);
              summary.addRaw(`3. Review cache patterns for optimization opportunities\n\n`);
            } else {
              summary.addRaw(`\n✅ **Healthy**: Cache usage is at a good level (${afterPercent}%).\n\n`);
              summary.addRaw(`**Maintenance:**\n`);
              summary.addRaw(`- Continue scheduled weekly cleanups\n`);
              summary.addRaw(`- Monitor for unusual growth patterns\n`);
              summary.addRaw(`- Keep cache key formats up to date\n\n`);
            }
            
            if (dryRun) {
              summary.addRaw(`\n---\n\n`);
              summary.addRaw(`> 💡 **Next Steps**: Run with **dry_run: false** to apply changes.\n\n`);
              summary.addRaw(`\`\`\`bash\n`);
              summary.addRaw(`gh workflow run cache-cleanup.yml \\\n`);
              summary.addRaw(`  -f cleanup_type=cache_only \\\n`);
              summary.addRaw(`  -f cache_pattern=ccache_stale \\\n`);
              summary.addRaw(`  -f cache_age_days=7 \\\n`);
              summary.addRaw(`  -f dry_run=false\n`);
              summary.addRaw(`\`\`\`\n`);
            }
            
            // ✅ NEW: Add quick actions
            summary.addHeading('⚡ Quick Actions', 3);
            summary.addRaw(`\n**Common cleanup commands:**\n\n`);
            
            summary.addRaw(`**1. Clean all legacy caches:**\n`);
            summary.addRaw(`\`\`\`bash\n`);
            summary.addRaw(`gh workflow run cache-cleanup.yml -f cleanup_type=cache_only -f cache_pattern=ccache_legacy -f dry_run=false\n`);
            summary.addRaw(`\`\`\`\n\n`);
            
            summary.addRaw(`**2. Clean stale caches (>14 days):**\n`);
            summary.addRaw(`\`\`\`bash\n`);
            summary.addRaw(`gh workflow run cache-cleanup.yml -f cleanup_type=cache_only -f cache_pattern=ccache_stale -f cache_age_days=14 -f dry_run=false\n`);
            summary.addRaw(`\`\`\`\n\n`);
            
            summary.addRaw(`**3. Clean specific device:**\n`);
            summary.addRaw(`\`\`\`bash\n`);
            summary.addRaw(`gh workflow run cache-cleanup.yml -f cleanup_type=cache_only -f device_filter=oneplus_ace2_pro_v -f cache_pattern=ccache_only -f dry_run=false\n`);
            summary.addRaw(`\`\`\`\n\n`);
            
            summary.addRaw(`**4. Full cleanup (caches + runs):**\n`);
            summary.addRaw(`\`\`\`bash\n`);
            summary.addRaw(`gh workflow run cache-cleanup.yml -f cleanup_type=full_cleanup -f cache_pattern=ccache_stale -f cache_age_days=7 -f dry_run=false\n`);
            summary.addRaw(`\`\`\`\n\n`);
            
            // ✅ NEW: Add cache health trend (if available)
            try {
              const cacheData = JSON.parse('${{ needs.analyze.outputs.cache_data }}');
              
              if (cacheData.recommendations && cacheData.recommendations.length > 0) {
                summary.addHeading('🎯 Priority Recommendations', 3);
                
                for (const rec of cacheData.recommendations) {
                  summary.addRaw(`\n${rec.emoji} **${rec.action}** (${rec.priority} priority)\n`);
                  summary.addRaw(`${rec.reason}\n`);
                  
                  if (rec.command) {
                    summary.addRaw(`\`\`\`bash\n${rec.command}\n\`\`\`\n`);
                  }
                  
                  if (rec.devices) {
                    summary.addRaw(`Affected: ${rec.devices}\n`);
                  }
                }
              }
            } catch (error) {
              console.log('Could not parse cache data for recommendations');
            }
            
            summary.addRaw(`\n---\n\n`);
            summary.addRaw(`📅 **Next Scheduled Cleanup**: Every Sunday at 00:00 UTC\n`);
            summary.addRaw(`🔗 **Workflow**: [Cache & Workflow Cleanup](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/cache-cleanup.yml)\n`);
            
            await summary.write();
            
            // ✅ NEW: Set workflow conclusion based on health
            if (parseFloat(afterPercent) > 95) {
              core.setFailed(`⚠️ Cache usage critical: ${afterPercent}% - Manual intervention required`);
            } else if (parseFloat(afterPercent) > 90) {
              core.warning(`⚠️ Cache usage very high: ${afterPercent}% - Cleanup recommended`);
            }
