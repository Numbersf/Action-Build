name: Cache Management

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Cache Action'
        required: true
        type: choice
        options:
          - 'list-all'
          - 'list-ccache'
          - 'list-apt'
          - 'list-by-device'
          - 'delete-ccache'
          - 'delete-apt'
          - 'delete-all'
          - 'delete-old'
          - 'delete-by-device'
          - 'show-stats'
      device_model:
        description: 'Select Device Model (for list/delete by device)'
        required: false
        type: choice
        options:
          - 'all'
          - 'oneplus_nord_ce4_lite_5g_v'
          - 'oneplus_nord_ce4_v'
          - 'oneplus_nord_4_v'
          - 'oneplus_ace_3v_v'
          - 'oneplus_10_pro_v'
          - 'oneplus_10t_v'
          - 'oneplus_11r_v'
          - 'oneplus_ace2_v'
          - 'oneplus_ace_pro_v'
          - 'oneplus_11_v'
          - 'oneplus_12r_v'
          - 'oneplus_ace2_pro_v'
          - 'oneplus_ace3_v'
          - 'oneplus_open_v'
          - 'oneplus_12_v'
          - 'oneplus_13r'
          - 'oneplus_ace3_pro_v'
          - 'oneplus_ace5'
          - 'oneplus_pad_pro_v'
          - 'oneplus_pad2_v'
          - 'oneplus_nord_5'
          - 'oneplus_ace5_pro'
          - 'oneplus_ace5_pro_b'
          - 'oneplus_13'
          - 'oneplus_13_b'
          - 'oneplus_13_global'
          - 'oneplus_13t'
          - 'oneplus_13t_b'
          - 'oneplus_13s'
          - 'oneplus_13s_b'
          - 'oneplus_pad_2_pro'
          - 'oneplus_pad_3'
          - 'oneplus_ace5_ultra'
          - 'oneplus_ace_6'
          - 'oneplus_15'
      days_old:
        description: 'Delete caches older than X days (for delete-old)'
        required: false
        type: number
        default: 7
      confirmation:
        description: 'Type "CONFIRM" to proceed with deletion'
        required: false
        type: string

  schedule:
    # Auto cleanup every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'

jobs:
  manage-cache:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GitHub CLI
        run: |
          sudo apt update && sudo apt install -y gh jq bc
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: List All Caches
        if: github.event.inputs.action == 'list-all' || github.event.inputs.action == 'show-stats'
        id: list-all
        run: |
          echo "## 📦 All Caches" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          gh api -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/caches \
            --paginate | jq -r '.actions_caches[] | 
            "\(.key)|\(.size_in_bytes)|\(.created_at)|\(.last_accessed_at)"' > all_caches.txt
          
          if [ ! -s all_caches.txt ]; then
            echo "No caches found" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          echo "| Cache Key | Size | Created | Last Accessed |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|------|---------|---------------|" >> $GITHUB_STEP_SUMMARY
          
          while IFS='|' read -r key size created accessed; do
            size_mb=$(echo "scale=2; $size / 1024 / 1024" | bc)
            echo "| \`${key:0:50}...\` | ${size_mb} MB | ${created:0:10} | ${accessed:0:10} |" >> $GITHUB_STEP_SUMMARY
          done < all_caches.txt
          
          total_size=$(awk -F'|' '{sum+=$2} END {print sum}' all_caches.txt)
          total_mb=$(echo "scale=2; $total_size / 1024 / 1024" | bc)
          total_gb=$(echo "scale=2; $total_size / 1024 / 1024 / 1024" | bc)
          cache_count=$(wc -l < all_caches.txt)
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total Caches:** $cache_count" >> $GITHUB_STEP_SUMMARY
          echo "**Total Size:** ${total_mb} MB (${total_gb} GB)" >> $GITHUB_STEP_SUMMARY
          
          echo "TOTAL_CACHES=$cache_count" >> $GITHUB_ENV
          echo "TOTAL_SIZE_MB=$total_mb" >> $GITHUB_ENV
          echo "TOTAL_SIZE_GB=$total_gb" >> $GITHUB_ENV

      - name: List ccache Only
        if: github.event.inputs.action == 'list-ccache'
        run: |
          echo "## 🔨 ccache Caches" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          gh api -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/caches \
            --paginate | jq -r '.actions_caches[] | select(.key | startswith("ccache-suki")) | 
            "\(.key)|\(.size_in_bytes)|\(.created_at)|\(.last_accessed_at)"' > ccache_only.txt
          
          if [ ! -s ccache_only.txt ]; then
            echo "No ccache caches found" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          echo "| Device | Size | Created | Last Accessed |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|---------|---------------|" >> $GITHUB_STEP_SUMMARY
          
          while IFS='|' read -r key size created accessed; do
            size_mb=$(echo "scale=2; $size / 1024 / 1024" | bc)
            device=$(echo "$key" | grep -oP 'oneplus_[^-]+' || echo "unknown")
            echo "| \`$device\` | ${size_mb} MB | ${created:0:10} | ${accessed:0:10} |" >> $GITHUB_STEP_SUMMARY
          done < ccache_only.txt
          
          total_size=$(awk -F'|' '{sum+=$2} END {print sum}' ccache_only.txt)
          total_mb=$(echo "scale=2; $total_size / 1024 / 1024" | bc)
          cache_count=$(wc -l < ccache_only.txt)
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total ccache:** $cache_count" >> $GITHUB_STEP_SUMMARY
          echo "**Total Size:** ${total_mb} MB" >> $GITHUB_STEP_SUMMARY

      - name: List APT Cache Only
        if: github.event.inputs.action == 'list-apt'
        run: |
          echo "## 📦 APT Package Caches" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          gh api -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/caches \
            --paginate | jq -r '.actions_caches[] | select(.key | contains("apt-cache")) | 
            "\(.key)|\(.size_in_bytes)|\(.created_at)|\(.last_accessed_at)"' > apt_only.txt
          
          if [ ! -s apt_only.txt ]; then
            echo "No APT caches found" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          echo "| Cache Key | Size | Created | Last Accessed |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|------|---------|---------------|" >> $GITHUB_STEP_SUMMARY
          
          while IFS='|' read -r key size created accessed; do
            size_mb=$(echo "scale=2; $size / 1024 / 1024" | bc)
            echo "| \`${key:0:60}...\` | ${size_mb} MB | ${created:0:10} | ${accessed:0:10} |" >> $GITHUB_STEP_SUMMARY
          done < apt_only.txt
          
          total_size=$(awk -F'|' '{sum+=$2} END {print sum}' apt_only.txt)
          total_mb=$(echo "scale=2; $total_size / 1024 / 1024" | bc)
          cache_count=$(wc -l < apt_only.txt)
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total APT caches:** $cache_count" >> $GITHUB_STEP_SUMMARY
          echo "**Total Size:** ${total_mb} MB" >> $GITHUB_STEP_SUMMARY

      - name: List Caches by Device
        if: github.event.inputs.action == 'list-by-device'
        run: |
          DEVICE="${{ github.event.inputs.device_model }}"
          
          if [ -z "$DEVICE" ] || [ "$DEVICE" = "all" ]; then
            echo "❌ Please select a specific device model"
            exit 1
          fi
          
          echo "## 📱 Caches for Device: $DEVICE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          gh api -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/caches \
            --paginate | jq -r --arg device "$DEVICE" \
            '.actions_caches[] | select(.key | contains($device)) | 
            "\(.id)|\(.key)|\(.size_in_bytes)|\(.created_at)|\(.last_accessed_at)"' > device_caches.txt
          
          if [ ! -s device_caches.txt ]; then
            echo "No caches found for device: $DEVICE" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          echo "| Cache ID | Cache Key | Size | Created | Last Accessed |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-----------|------|---------|---------------|" >> $GITHUB_STEP_SUMMARY
          
          while IFS='|' read -r id key size created accessed; do
            size_mb=$(echo "scale=2; $size / 1024 / 1024" | bc)
            echo "| $id | \`${key:0:40}...\` | ${size_mb} MB | ${created:0:10} | ${accessed:0:10} |" >> $GITHUB_STEP_SUMMARY
          done < device_caches.txt
          
          total_size=$(awk -F'|' '{sum+=$3} END {print sum}' device_caches.txt)
          total_mb=$(echo "scale=2; $total_size / 1024 / 1024" | bc)
          cache_count=$(wc -l < device_caches.txt)
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total caches for $DEVICE:** $cache_count" >> $GITHUB_STEP_SUMMARY
          echo "**Total Size:** ${total_mb} MB" >> $GITHUB_STEP_SUMMARY

      - name: Show Cache Statistics
        if: github.event.inputs.action == 'show-stats'
        run: |
          echo "## 📊 Cache Statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # ccache stats
          ccache_count=$(gh api /repos/${{ github.repository }}/actions/caches --paginate | \
            jq '[.actions_caches[] | select(.key | startswith("ccache-suki"))] | length')
          ccache_size=$(gh api /repos/${{ github.repository }}/actions/caches --paginate | \
            jq '[.actions_caches[] | select(.key | startswith("ccache-suki")) | .size_in_bytes] | add // 0')
          ccache_mb=$(echo "scale=2; $ccache_size / 1024 / 1024" | bc)
          
          # APT stats
          apt_count=$(gh api /repos/${{ github.repository }}/actions/caches --paginate | \
            jq '[.actions_caches[] | select(.key | contains("apt-cache"))] | length')
          apt_size=$(gh api /repos/${{ github.repository }}/actions/caches --paginate | \
            jq '[.actions_caches[] | select(.key | contains("apt-cache")) | .size_in_bytes] | add // 0')
          apt_mb=$(echo "scale=2; $apt_size / 1024 / 1024" | bc)
          
          # Other caches
          other_count=$(gh api /repos/${{ github.repository }}/actions/caches --paginate | \
            jq '[.actions_caches[] | select(.key | startswith("ccache-suki") | not) | select(.key | contains("apt-cache") | not)] | length')
          other_size=$(gh api /repos/${{ github.repository }}/actions/caches --paginate | \
            jq '[.actions_caches[] | select(.key | startswith("ccache-suki") | not) | select(.key | contains("apt-cache") | not) | .size_in_bytes] | add // 0')
          other_mb=$(echo "scale=2; $other_size / 1024 / 1024" | bc)
          
          echo "| Cache Type | Count | Size (MB) | Percentage |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|-------|-----------|------------|" >> $GITHUB_STEP_SUMMARY
          
          total_size=$((ccache_size + apt_size + other_size))
          if [ $total_size -gt 0 ]; then
            ccache_pct=$(echo "scale=2; $ccache_size * 100 / $total_size" | bc)
            apt_pct=$(echo "scale=2; $apt_size * 100 / $total_size" | bc)
            other_pct=$(echo "scale=2; $other_size * 100 / $total_size" | bc)
          else
            ccache_pct=0
            apt_pct=0
            other_pct=0
          fi
          
          echo "| 🔨 ccache | $ccache_count | $ccache_mb | ${ccache_pct}% |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 APT | $apt_count | $apt_mb | ${apt_pct}% |" >> $GITHUB_STEP_SUMMARY
          echo "| 📁 Other | $other_count | $other_mb | ${other_pct}% |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total** | **${{ env.TOTAL_CACHES }}** | **${{ env.TOTAL_SIZE_MB }}** | **100%** |" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💾 Storage Usage" >> $GITHUB_STEP_SUMMARY
          echo "- **Used:** ${{ env.TOTAL_SIZE_GB }} GB" >> $GITHUB_STEP_SUMMARY
          echo "- **Limit:** 10 GB (GitHub Actions default)" >> $GITHUB_STEP_SUMMARY
          
          usage_pct=$(echo "scale=2; ${{ env.TOTAL_SIZE_GB }} * 100 / 10" | bc)
          echo "- **Usage:** ${usage_pct}%" >> $GITHUB_STEP_SUMMARY
          
          if (( $(echo "${{ env.TOTAL_SIZE_GB }} > 8" | bc -l) )); then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Warning:** Cache usage is above 80%. Consider cleaning old caches." >> $GITHUB_STEP_SUMMARY
          fi
          
          # Device breakdown
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 Cache by Device" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Device | Cache Count | Total Size (MB) |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------------|-----------------|" >> $GITHUB_STEP_SUMMARY
          
          # List all devices
          DEVICES=(
            "oneplus_nord_ce4_lite_5g_v" "oneplus_nord_ce4_v" "oneplus_nord_4_v"
            "oneplus_ace_3v_v" "oneplus_10_pro_v" "oneplus_10t_v" "oneplus_11r_v"
            "oneplus_ace2_v" "oneplus_ace_pro_v" "oneplus_11_v" "oneplus_12r_v"
            "oneplus_ace2_pro_v" "oneplus_ace3_v" "oneplus_open_v" "oneplus_12_v"
            "oneplus_13r" "oneplus_ace3_pro_v" "oneplus_ace5" "oneplus_pad_pro_v"
            "oneplus_pad2_v" "oneplus_nord_5" "oneplus_ace5_pro" "oneplus_ace5_pro_b"
            "oneplus_13" "oneplus_13_b" "oneplus_13_global" "oneplus_13t" "oneplus_13t_b"
            "oneplus_13s" "oneplus_13s_b" "oneplus_pad_2_pro" "oneplus_pad_3"
            "oneplus_ace5_ultra" "oneplus_ace_6" "oneplus_15"
          )
          
          for device in "${DEVICES[@]}"; do
            device_data=$(gh api /repos/${{ github.repository }}/actions/caches --paginate | \
              jq -r --arg device "$device" \
              '[.actions_caches[] | select(.key | contains($device))] | 
              {count: length, size: (map(.size_in_bytes) | add // 0)} | 
              "\(.count)|\(.size)"')
            
            if [ -n "$device_data" ]; then
              IFS='|' read -r count size <<< "$device_data"
              if [ "$count" -gt 0 ]; then
                size_mb=$(echo "scale=2; $size / 1024 / 1024" | bc)
                echo "| \`$device\` | $count | ${size_mb} |" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          done

      - name: Verify Deletion Confirmation
        if: |
          github.event.inputs.action == 'delete-ccache' ||
          github.event.inputs.action == 'delete-apt' ||
          github.event.inputs.action == 'delete-all' ||
          github.event.inputs.action == 'delete-old' ||
          github.event.inputs.action == 'delete-by-device'
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "CONFIRM" ]; then
            echo "❌ Deletion cancelled: confirmation not provided"
            echo "Please type 'CONFIRM' in the confirmation field to proceed"
            exit 1
          fi
          echo "✅ Confirmation verified"

      - name: Delete ccache Caches
        if: github.event.inputs.action == 'delete-ccache'
        run: |
          echo "## 🗑️ Deleting ccache Caches" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          cache_ids=$(gh api /repos/${{ github.repository }}/actions/caches --paginate | \
            jq -r '.actions_caches[] | select(.key | startswith("ccache-suki")) | .id')
          
          if [ -z "$cache_ids" ]; then
            echo "No ccache caches to delete" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          count=0
          for id in $cache_ids; do
            echo "Deleting cache ID: $id"
            gh api --method DELETE /repos/${{ github.repository }}/actions/caches/$id || true
            count=$((count + 1))
          done
          
          echo "✅ Deleted $count ccache caches" >> $GITHUB_STEP_SUMMARY

      - name: Delete APT Caches
        if: github.event.inputs.action == 'delete-apt'
        run: |
          echo "## 🗑️ Deleting APT Caches" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          cache_ids=$(gh api /repos/${{ github.repository }}/actions/caches --paginate | \
            jq -r '.actions_caches[] | select(.key | contains("apt-cache")) | .id')
          
          if [ -z "$cache_ids" ]; then
            echo "No APT caches to delete" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          count=0
          for id in $cache_ids; do
            echo "Deleting cache ID: $id"
            gh api --method DELETE /repos/${{ github.repository }}/actions/caches/$id || true
            count=$((count + 1))
          done
          
          echo "✅ Deleted $count APT caches" >> $GITHUB_STEP_SUMMARY

      - name: Delete All Caches
        if: github.event.inputs.action == 'delete-all'
        run: |
          echo "## 🗑️ Deleting All Caches" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **WARNING: This will delete ALL caches!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          cache_ids=$(gh api /repos/${{ github.repository }}/actions/caches --paginate | \
            jq -r '.actions_caches[] | .id')
          
          if [ -z "$cache_ids" ]; then
            echo "No caches to delete" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          count=0
          for id in $cache_ids; do
            echo "Deleting cache ID: $id"
            gh api --method DELETE /repos/${{ github.repository }}/actions/caches/$id || true
            count=$((count + 1))
          done
          
          echo "✅ Deleted $count caches" >> $GITHUB_STEP_SUMMARY

      - name: Delete Old Caches
        if: github.event.inputs.action == 'delete-old'
        run: |
          echo "## 🗑️ Deleting Caches Older Than ${{ github.event.inputs.days_old }} Days" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          cutoff_date=$(date -u -d "${{ github.event.inputs.days_old }} days ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "Cutoff date: $cutoff_date" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          cache_data=$(gh api /repos/${{ github.repository }}/actions/caches --paginate | \
            jq -r --arg cutoff "$cutoff_date" \
            '.actions_caches[] | select(.last_accessed_at < $cutoff) | "\(.id)|\(.key)|\(.last_accessed_at)"')
          
          if [ -z "$cache_data" ]; then
            echo "No old caches to delete" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          echo "| Cache Key | Last Accessed | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|---------------|--------|" >> $GITHUB_STEP_SUMMARY
          
          count=0
          while IFS='|' read -r id key accessed; do
            echo "Deleting cache: $key (last accessed: $accessed)"
            if gh api --method DELETE /repos/${{ github.repository }}/actions/caches/$id 2>/dev/null; then
              echo "| \`${key:0:50}...\` | ${accessed:0:10} | ✅ Deleted |" >> $GITHUB_STEP_SUMMARY
              count=$((count + 1))
            else
              echo "| \`${key:0:50}...\` | ${accessed:0:10} | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          done <<< "$cache_data"
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deleted $count old caches" >> $GITHUB_STEP_SUMMARY

      - name: Delete Caches by Device
        if: github.event.inputs.action == 'delete-by-device'
        run: |
          DEVICE="${{ github.event.inputs.device_model }}"
          
          if [ -z "$DEVICE" ] || [ "$DEVICE" = "all" ]; then
            echo "❌ Please select a specific device model"
            exit 1
          fi
          
          echo "## 🗑️ Deleting Caches for Device: $DEVICE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          cache_data=$(gh api /repos/${{ github.repository }}/actions/caches --paginate | \
            jq -r --arg device "$DEVICE" \
            '.actions_caches[] | select(.key | contains($device)) | "\(.id)|\(.key)"')
          
          if [ -z "$cache_data" ]; then
            echo "No caches found for device: $DEVICE" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          echo "| Cache Key | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          
          count=0
          while IFS='|' read -r id key; do
            echo "Deleting cache: $key"
            if gh api --method DELETE /repos/${{ github.repository }}/actions/caches/$id 2>/dev/null; then
              echo "| \`${key:0:60}...\` | ✅ Deleted |" >> $GITHUB_STEP_SUMMARY
              count=$((count + 1))
            else
              echo "| \`${key:0:60}...\` | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          done <<< "$cache_data"
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deleted $count caches for device: $DEVICE" >> $GITHUB_STEP_SUMMARY

      - name: Auto Cleanup (Scheduled)
        if: github.event_name == 'schedule'
        run: |
          echo "## 🤖 Automated Cache Cleanup" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Running scheduled cleanup (every Sunday)..." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Delete caches older than 14 days
          cutoff_date=$(date -u -d "14 days ago" +%Y-%m-%dT%H:%M:%SZ)
          
          cache_ids=$(gh api /repos/${{ github.repository }}/actions/caches --paginate | \
            jq -r --arg cutoff "$cutoff_date" \
            '.actions_caches[] | select(.last_accessed_at < $cutoff) | .id')
          
          if [ -z "$cache_ids" ]; then
            echo "No old caches to clean up" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          count=0
          for id in $cache_ids; do
            gh api --method DELETE /repos/${{ github.repository }}/actions/caches/$id || true
            count=$((count + 1))
          done
          
          echo "✅ Cleaned up $count caches older than 14 days" >> $GITHUB_STEP_SUMMARY

      - name: Final Summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 Action Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Action:** ${{ github.event.inputs.action || 'scheduled cleanup' }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ github.event.inputs.device_model }}" ]; then
            echo "- **Device:** ${{ github.event.inputs.device_model }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
